name: Temporary MK1 formatting cleanup
on:
  push:
    branches:
      - 'integrate/mk1-main-stabilization-20261015'
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'em3rc0dTh/AppM-Site-Mapper'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: integrate/mk1-main-stabilization-20261015
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply exact project Prettier version to identified files
        run: |
          ./node_modules/.bin/prettier --write \
            docs/operations/mqtt-modbus-lab.md \
            docs/operations/runbook.md \
            docs/release/MK1-MAIN-STABILIZATION-2026-10-15.md \
            infra/modbus-tcp/server.test.mjs \
            infra/operational-console/server.mjs \
            scripts/operations/certify-modbus-cb01.mjs \
            src/components/telemetry/equipment-telemetry-inspector.tsx
      - name: Commit formatting only to isolated consolidation branch
        run: |
          git add -- \
            docs/operations/mqtt-modbus-lab.md \
            docs/operations/runbook.md \
            docs/release/MK1-MAIN-STABILIZATION-2026-10-15.md \
            infra/modbus-tcp/server.test.mjs \
            infra/operational-console/server.mjs \
            scripts/operations/certify-modbus-cb01.mjs \
            src/components/telemetry/equipment-telemetry-inspector.tsx
          if git diff --cached --quiet; then
            echo "No formatting changes required"
          else
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style: normalize MK1 telemetry and Modbus files with Prettier'
            git push origin HEAD:refs/heads/integrate/mk1-main-stabilization-20261015
          fi
