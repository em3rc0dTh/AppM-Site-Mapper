name: Temporary master manual formatting
on:
  push:
    branches:
      - docs/manual-maestro-operacion-modelo-20261019
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'em3rc0dTh/AppM-Site-Mapper'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: docs/manual-maestro-operacion-modelo-20261019
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply pinned Prettier only to edited docs
        run: |
          ./node_modules/.bin/prettier --write \
            README.md docs/README.md \
            docs/user-guide/README.md \
            docs/user-guide/manual-maestro.md \
            docs/user-guide/modelo-de-datos.md \
            docs/user-guide/evidencia-visual.md \
            scripts/ci/docs-links.mjs
      - name: Commit formatting on feature branch
        run: |
          git add -- README.md docs/README.md docs/user-guide/README.md docs/user-guide/manual-maestro.md docs/user-guide/modelo-de-datos.md docs/user-guide/evidencia-visual.md scripts/ci/docs-links.mjs
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style: normalize operator master manual with pinned Prettier'
            git push origin HEAD:refs/heads/docs/manual-maestro-operacion-modelo-20261019
          fi
