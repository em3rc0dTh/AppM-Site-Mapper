name: Temporary operator manual formatting
on:
  push:
    branches:
      - docs/operator-mk1-onboarding-20261019
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'em3rc0dTh/AppM-Site-Mapper'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: docs/operator-mk1-onboarding-20261019
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply pinned Prettier to the handbook and indexes
        run: |
          ./node_modules/.bin/prettier --write \
            README.md docs/README.md docs/product/MVP-DEMO-ES.md \
            scripts/ci/docs-links.mjs docs/user-guide/*.md
      - name: Commit formatting only to the isolated documentation branch
        run: |
          git add -- README.md docs/README.md docs/product/MVP-DEMO-ES.md scripts/ci/docs-links.mjs docs/user-guide/*.md
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style: normalize Site Mapper operator handbook with pinned Prettier'
            git push origin HEAD:refs/heads/docs/operator-mk1-onboarding-20261019
          fi
