name: Temporary Power Responsive Formatting
on:
  push:
    branches:
      - fix/power-connect-responsive-scroll-20261019
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'em3rc0dTh/AppM-Site-Mapper'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/power-connect-responsive-scroll-20261019
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Normalize changed presentation files
        run: ./node_modules/.bin/prettier --write src/app/interaction-recovery.css docs/operations/power-port-cardinality.md
      - name: Commit formatted files only to feature branch
        run: |
          git add -- src/app/interaction-recovery.css docs/operations/power-port-cardinality.md
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style: normalize power connection responsive styles'
            git push origin HEAD:refs/heads/fix/power-connect-responsive-scroll-20261019
          fi
