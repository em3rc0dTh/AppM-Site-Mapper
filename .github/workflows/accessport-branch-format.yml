name: One-time AccessPort format
on:
  push:
    branches:
      - fix/access-port-panel-picker-modal-20261022
    paths:
      - .github/workflows/accessport-branch-format.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/access-port-panel-picker-modal-20261022
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format AccessPort files
        run: |
          npx prettier --write \
            src/app/api/equipment/'[id]'/available-panels/route.ts \
            src/app/mk1.css \
            src/components/equipment/access-port-editor.tsx
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/app/api/equipment/'[id]'/available-panels/route.ts src/app/mk1.css src/components/equipment/access-port-editor.tsx
          if ! git diff --cached --quiet; then
            git commit -m 'style(accessport): apply repository Prettier formatting'
            git push origin HEAD:fix/access-port-panel-picker-modal-20261022
          fi
