name: Alarm branch one-shot formatter

on:
  push:
    branches:
      - feat/alarm-system-part4
    paths:
      - '.github/workflows/alarm-format-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/alarm-system-part4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format only alarm files reported by CI
        run: |
          npx prettier --write \
            src/components/alarm/alarm-detail.tsx \
            src/components/alarm/alarm-header-badge.tsx \
            src/components/alarm/alarm-scope-summary.tsx \
            src/modules/alarm/application/alarm-modbus-projection.ts
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/alarm/alarm-detail.tsx \
            src/components/alarm/alarm-header-badge.tsx \
            src/components/alarm/alarm-scope-summary.tsx \
            src/modules/alarm/application/alarm-modbus-projection.ts
          git commit -m "style(alarm): apply repository prettier"
          git push origin HEAD:feat/alarm-system-part4
