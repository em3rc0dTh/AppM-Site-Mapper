name: Alarm hardening one-shot formatter

on:
  push:
    branches:
      - fix/alarm-hardening-redteam-2026-10-30
    paths:
      - '.github/workflows/alarm-hardening-format-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/alarm-hardening-redteam-2026-10-30
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: |
          npx prettier --write \
            src/modules/alarm/application/alarm-command-service.ts \
            src/modules/alarm/infrastructure/memory-alarm-repository.ts
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/modules/alarm/application/alarm-command-service.ts \
            src/modules/alarm/infrastructure/memory-alarm-repository.ts
          git commit -m "style(alarm): apply repository prettier"
          git push origin HEAD:fix/alarm-hardening-redteam-2026-10-30
