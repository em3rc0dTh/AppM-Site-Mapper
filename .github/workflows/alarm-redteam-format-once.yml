name: Alarm red-team one-shot formatter

on:
  push:
    branches:
      - test/alarm-redteam-2026-10-30
    paths:
      - '.github/workflows/alarm-redteam-format-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: test/alarm-redteam-2026-10-30
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write tests/integration/alarm-redteam-mongo.test.ts
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/integration/alarm-redteam-mongo.test.ts
          git commit -m "style(test): format alarm red-team Mongo attack"
          git push origin HEAD:test/alarm-redteam-2026-10-30
