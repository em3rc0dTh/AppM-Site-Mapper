name: Alarm red-team Mongo concurrency

on:
  pull_request:
    paths:
      - 'tests/integration/alarm-redteam-mongo.test.ts'
      - '.github/workflows/alarm-redteam-mongo-once.yml'
  push:
    branches:
      - test/alarm-redteam-2026-10-30
    paths:
      - '.github/workflows/alarm-redteam-mongo-once.yml'

permissions:
  contents: read

jobs:
  mongo-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ALARM_REDTEAM_MONGO_URI: mongodb://127.0.0.1:27018
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Start disposable MongoDB
        run: |
          docker run -d --name alarm-redteam-mongo -p 127.0.0.1:27018:27017 mongo:7 --bind_ip_all
          for i in {1..40}; do
            if docker exec alarm-redteam-mongo mongosh --quiet --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs alarm-redteam-mongo
          exit 1
      - name: Run real Mongo alarm concurrency attack
        run: npx vitest run tests/integration/alarm-redteam-mongo.test.ts
      - name: Cleanup
        if: always()
        run: docker rm -f alarm-redteam-mongo || true
