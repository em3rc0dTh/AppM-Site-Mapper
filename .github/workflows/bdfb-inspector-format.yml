name: Temporary BDFB inspector formatter
on:
  push:
    branches:
      - fix/bdfb-snmp-inspector-clarity-20261022
    paths:
      - .github/workflows/bdfb-inspector-format.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bdfb-snmp-inspector-clarity-20261022
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format changed files
        run: |
          npx prettier --write \
            src/components/power/snmp-feed-load-panel.tsx \
            src/components/power/snmp-feed-commissioning.tsx \
            src/components/equipment/access-port-editor.tsx \
            src/app/interaction-recovery.css
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/components/power/snmp-feed-load-panel.tsx src/components/power/snmp-feed-commissioning.tsx src/components/equipment/access-port-editor.tsx src/app/interaction-recovery.css
          if ! git diff --cached --quiet; then
            git commit -m 'style(snmp): apply formatting to inspector refactor'
            git push origin HEAD:fix/bdfb-snmp-inspector-clarity-20261022
          fi
