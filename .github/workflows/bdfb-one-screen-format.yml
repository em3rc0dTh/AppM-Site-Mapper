name: Temporary BFDB one-screen formatter
on:
  push:
    branches:
      - fix/bdfb-one-screen-feed-commission-20261022
    paths:
      - .github/workflows/bdfb-one-screen-format.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bdfb-one-screen-feed-commission-20261022
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format changed files
        run: |
          npx prettier --write \
            src/components/equipment/access-port-editor.tsx \
            src/app/mk1.css
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/components/equipment/access-port-editor.tsx src/app/mk1.css
          if ! git diff --cached --quiet; then
            git commit -m 'style(bdfb): apply Prettier rules'
            git push origin HEAD:fix/bdfb-one-screen-feed-commission-20261022
          fi
