name: Temporary BDFB physical stage formatter
on:
  push:
    branches:
      - feat/bdfb-physical-stage-panel-focus-20261022
    paths:
      - .github/workflows/bdfb-stage-format.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bdfb-physical-stage-panel-focus-20261022
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply repository Prettier to physical stage changes
        run: |
          npx prettier --write \
            src/components/power/bdfb-chassis.tsx \
            src/app/home-redesign.css \
            'src/app/topology/[...path]/page.tsx'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/components/power/bdfb-chassis.tsx src/app/home-redesign.css 'src/app/topology/[...path]/page.tsx'
          if ! git diff --cached --quiet; then
            git commit -m 'style(bdfb): format selected panel physical workspace'
            git push origin HEAD:feat/bdfb-physical-stage-panel-focus-20261022
          fi
