name: Format BDFB wireframe documentation
on:
  push:
    branches:
      - docs/bdfb-wireframe-tabbed-full-v3-20261022
    paths:
      - .github/workflows/bdfb-wireframe-v3-format.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/bdfb-wireframe-tabbed-full-v3-20261022
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format canonical wireframes
        run: |
          npx prettier --write 'docs/ui/Wireframes documentation.md'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'docs/ui/Wireframes documentation.md'
          if ! git diff --cached --quiet; then
            git commit -m 'style(docs): apply canonical wireframe Markdown formatting'
            git push origin HEAD:docs/bdfb-wireframe-tabbed-full-v3-20261022
          fi
