name: Bootstrap MongoDB dependency

on:
  push:
    branches:
      - feat/mk1-g3-persistence

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/mk1-g3-persistence
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm install mongodb --save-exact --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes"
            exit 0
          fi
          git commit -m "chore: lock mongodb dependency"
          git push origin HEAD:feat/mk1-g3-persistence
