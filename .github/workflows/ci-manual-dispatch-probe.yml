name: Temporary manual Actions dispatcher

on:
  pull_request:
    paths:
      - '.github/workflows/ci-manual-dispatch-probe.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch BFDB MQTT integration
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bfdb-mqtt-integration.yml --ref main

      - name: Dispatch Visual parity capture
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run visual-parity.yml --ref main
