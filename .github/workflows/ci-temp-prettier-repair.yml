name: Temporary Prettier repair

on:
  push:
    branches:
      - 'fix/ci-runner-format-2026-11-09'
    paths:
      - '.github/workflows/ci-temp-prettier-repair.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ci-runner-format-2026-11-09
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format affected release docs with repository Prettier
        run: |
          npx prettier --write \
            docs/release/client-delivery-field-commissioning-runbook.md \
            docs/release/client-vm-appliance.md \
            docs/release/field-readonly-gate.md
      - name: Remove this temporary workflow and push formatted docs
        run: |
          rm .github/workflows/ci-temp-prettier-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/release/client-delivery-field-commissioning-runbook.md \
                  docs/release/client-vm-appliance.md \
                  docs/release/field-readonly-gate.md \
                  .github/workflows/ci-temp-prettier-repair.yml
          git diff --cached --quiet && exit 0
          git commit -m "style: format release docs with Prettier"
          git push origin HEAD:fix/ci-runner-format-2026-11-09
