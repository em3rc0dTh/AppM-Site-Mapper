name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/modbus-tcp-site-mapper-sidecar'
      - 'feat/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: MVP documentation links
        run: npm run docs:check

      - name: Unit tests
        run: npm run test:unit

      - name: Mongo audit regression tests
        run: npm run test:audit-mongo

      - name: Integration tests
        run: npm run test:integration

      - name: Modbus TCP register contract and real MBAP regression
        run: node --test infra/modbus-tcp/server.test.mjs

      - name: Read-only Modbus certification script syntax
        run: node --check scripts/operations/certify-modbus-cb01.mjs

      - name: Telemetry history SQL regression
        run: python3 -m unittest discover -s infra/telemetry-store -p 'test_*.py'

      - name: System certification
        run: npm run test:certification

      - name: Build
        run: npm run build

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
