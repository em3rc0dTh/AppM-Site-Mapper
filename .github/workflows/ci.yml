name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: |
          npx prettier --write src/modules/telemetry/domain/canonical.ts src/modules/telemetry/domain/myems-appm-breaker-adapter.ts
          git diff -- src/modules/telemetry/domain/canonical.ts src/modules/telemetry/domain/myems-appm-breaker-adapter.ts
          git diff --exit-code -- src/modules/telemetry/domain/canonical.ts src/modules/telemetry/domain/myems-appm-breaker-adapter.ts

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

      - name: System certification
        run: npm run test:certification

      - name: Build
        run: npm run build

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
