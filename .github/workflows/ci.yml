name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'chore/english-ui-baseline-20261022'
      - 'feat/modbus-tcp-site-mapper-sidecar'
      - 'feat/**'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Synchronize next-intl lockfile (one-time)
        if: github.event_name == 'push' && github.ref_name == 'chore/english-ui-baseline-20261022' && github.actor != 'github-actions[bot]'
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Normalize English-first i18n changes (one-time)
        if: github.event_name == 'push' && github.ref_name == 'chore/english-ui-baseline-20261022' && github.actor != 'github-actions[bot]'
        run: |
          npx prettier --write 'src/messages/*.json' 'src/i18n/*.ts' 'src/global.d.ts' 'src/app/layout.tsx' 'src/app/login/page.tsx' 'src/app/change-password/page.tsx' 'src/app/workspace/page.tsx' 'src/shared/ui/app-shell.tsx' 'src/components/equipment/equipment-focus-inspector.tsx' 'src/components/power/bdfb-telemetry-inspector.tsx' 'src/components/power/snmp-feed-history.tsx' 'tests/unit/i18n-catalogs.test.ts' 'docs/ui/language-policy.md' 'next.config.ts'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json src/messages src/i18n src/global.d.ts src/app/layout.tsx src/app/login/page.tsx src/app/change-password/page.tsx src/app/workspace/page.tsx src/shared/ui/app-shell.tsx src/components/equipment/equipment-focus-inspector.tsx src/components/power/bdfb-telemetry-inspector.tsx src/components/power/snmp-feed-history.tsx tests/unit/i18n-catalogs.test.ts docs/ui/language-policy.md next.config.ts
          if ! git diff --cached --quiet; then
            git commit -m 'build(i18n): lock next-intl and format bilingual catalog infrastructure'
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: MVP documentation links
        run: npm run docs:check

      - name: Unit tests
        run: npm run test:unit

      - name: Mongo audit regression tests
        run: npm run test:audit-mongo

      - name: Integration tests
        run: npm run test:integration

      - name: Modbus TCP register contract and real MBAP regression
        run: node --test infra/modbus-tcp/server.test.mjs

      - name: Read-only Modbus certification script syntax
        run: node --check scripts/operations/certify-modbus-cb01.mjs

      - name: Telemetry history SQL regression
        run: python3 -m unittest discover -s infra/telemetry-store -p 'test_*.py'

      - name: System certification
        run: npm run test:certification

      - name: Build
        run: npm run build

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
