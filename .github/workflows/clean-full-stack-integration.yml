name: Clean full-stack integration

on:
  pull_request:
    paths:
      - 'docker-compose.telemetry.yml'
      - 'docker-compose.integration.yml'
      - 'infra/integration/**'
      - 'infra/snmp-collector/**'
      - 'docker-compose.integration.yml'
      - 'src/seeds/**'
      - 'src/modules/telemetry/**'
      - '.github/workflows/clean-full-stack-integration.yml'
  push:
    branches:
      - 'release/**'
    paths:
      - 'docker-compose.telemetry.yml'
      - 'docker-compose.integration.yml'
      - 'infra/integration/**'
      - 'infra/snmp-collector/**'
      - 'src/seeds/**'
      - 'src/modules/telemetry/**'
      - '.github/workflows/clean-full-stack-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install root dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate controlled integration sources
        run: |
          node --check infra/snmp-collector/integration-agent.mjs
          node --check infra/snmp-collector/integration-trap-sender.mjs
          sh -n infra/integration/mqtt-publisher.sh

      - name: Validate Compose resolution
        run: |
          docker compose             --env-file infra/integration/integration.env             -f docker-compose.telemetry.yml             -f docker-compose.integration.yml             config --quiet

      - name: Start from an empty runner
        run: |
          docker compose             --env-file infra/integration/integration.env             -f docker-compose.telemetry.yml             -f docker-compose.integration.yml             up -d --build

      - name: Require seed-01 v6 and physical topology bootstrap
        run: |
          set -eu
          dc() {
            docker compose               --env-file infra/integration/integration.env               -f docker-compose.telemetry.yml               -f docker-compose.integration.yml "$@"
          }

          for i in $(seq 1 90); do
            bootstrap_id="$(dc ps -aq integration-bootstrap)"
            if [ -n "$bootstrap_id" ]; then
              code="$(docker inspect -f '{{.State.ExitCode}}' "$bootstrap_id" 2>/dev/null || echo 99)"
              state="$(docker inspect -f '{{.State.Status}}' "$bootstrap_id" 2>/dev/null || echo missing)"
              if [ "$state" = "exited" ] && [ "$code" = "0" ]; then
                break
              fi
            fi
            if [ "$i" = "90" ]; then exit 1; fi
            sleep 2
          done

          dc exec -T mongodb mongosh --quiet seed-01 --eval '
            const s=db.runtime_seed_state.findOne({_id:"seed-01",status:"APPLIED"});
            if(!s || s.version!==6 || !Array.isArray(s.bdfbs) || s.bdfbs.length!==3) quit(1);
            const c=db.topology_nodes;
            const kinds=[
              ["NETWORK",1],["SITE",1],["STRUCTURE",1],["LEVEL",1],
              ["ROOM_SUBSTRUCTURE",2],["CONTAINER_CLUSTER_BAY",4],
              ["POSITION",3],["CONTAINER_RACK",3],["DEVICE",3],["EQUIPMENT",96]
            ];
            for(const [kind,count] of kinds) {
              const actual=c.countDocuments({kind});
              if(actual!==count) { print("NODE_COUNT_CONFLICT "+kind+" "+actual+" expected="+count); quit(1); }
            }
            const room=c.findOne({kind:"ROOM_SUBSTRUCTURE",lifecycle:"ACTIVE",name:"SALA DE TRANSMISIONES"});
            if(!room || s.roomId!==room.id || JSON.stringify(room.polygon)!==JSON.stringify([
              {x:12000,y:10200},{x:26400,y:10200},{x:26400,y:18000},{x:12000,y:18000}
            ])) quit(1);
            const bays=c.find({kind:"CONTAINER_CLUSTER_BAY",parentId:room.id,lifecycle:"ACTIVE"}).toArray();
            if(bays.length!==4) quit(1);
            for(const name of ["Contained-Cluster-01","Contained-Cluster-02","Contained-Cluster-03","CONTAINED-CLUSTER-04"])
              if(!bays.some(b=>b.name===name)) quit(1);
            if(c.countDocuments({kind:"ROOM_SUBSTRUCTURE",lifecycle:"ARCHIVED"})!==1 ||
               c.countDocuments({kind:"EQUIPMENT",equipmentType:"PANEL",lifecycle:"ARCHIVED"})!==6) quit(1);
            const physical=[
              ["QDF2","QDF2 anchor","T",24600,11400],
              ["QDF4","QDF4 anchor","Z",24600,15000],
              ["QDF5","QDF5 anchor","AC",24600,16800]
            ];
            for(const [name,anchor,row,x,y] of physical) {
              const rack=c.findOne({kind:"CONTAINER_RACK",name,lifecycle:"ACTIVE"});
              if(!rack || rack.totalU!==42 || rack.placementState!=="CONFIRMED" ||
                 rack.placementMm?.x!==x || rack.placementMm?.y!==y ||
                 rack.dimensionsMm?.width!==600 || rack.dimensionsMm?.depth!==600 ||
                 !rack.cas?.some(r=>r.state==="EQUIPPED" && r.startU===1 && r.endU===42)) quit(1);
              const pos=c.findOne({id:rack.parentId,kind:"POSITION",name:anchor,lifecycle:"ACTIVE"});
              if(!pos || pos.coordinate?.row!==row || pos.coordinate?.column!==42) quit(1);
            }
            if(c.countDocuments({kind:"EQUIPMENT",equipmentType:"CIRCUIT_BREAKER",lifecycle:"ACTIVE"})!==48) quit(1);
            print("SEED01_V6_PHYSICAL_BOOTSTRAP_OK");
          '

      - name: Require MQTT subscribed and durable telemetry
        run: |
          set -eu
          dc() {
            docker compose               --env-file infra/integration/integration.env               -f docker-compose.telemetry.yml               -f docker-compose.integration.yml "$@"
          }

          for i in $(seq 1 60); do
            if dc logs --no-color site-mapper 2>&1 | grep -q '"message":"mqtt.subscribed"\|mqtt.subscribed'; then
              break
            fi
            if [ "$i" = "60" ]; then exit 1; fi
            sleep 2
          done

          for i in $(seq 1 60); do
            rows="$(dc exec -T timescaledb psql -U site_mapper -d site_mapper_telemetry -Atc               "SELECT count(*) FROM telemetry_samples WHERE source_identity IN ('26092403950004','26092403950002');"               2>/dev/null || echo 0)"
            if [ "${rows:-0}" -gt 0 ]; then
              echo "MQTT_HISTORY_ROWS=$rows"
              break
            fi
            if [ "$i" = "60" ]; then exit 1; fi
            sleep 2
          done

      - name: Require all three SNMP collectors accepted and persisted
        run: |
          set -eu
          dc() {
            docker compose               --env-file infra/integration/integration.env               -f docker-compose.telemetry.yml               -f docker-compose.integration.yml "$@"
          }

          for service in snmp-collector-qdf2 snmp-collector-qdf4 snmp-collector-qdf5; do
            for i in $(seq 1 45); do
              if dc logs --no-color "$service" 2>&1 | grep -q 'snmp.poll.accepted'; then
                break
              fi
              if [ "$i" = "45" ]; then
                echo "No accepted SNMP poll from $service"
                exit 1
              fi
              sleep 2
            done
          done

          for i in $(seq 1 45); do
            rows="$(dc exec -T timescaledb psql -U site_mapper -d site_mapper_telemetry -Atc               "SELECT count(*) FROM telemetry_entity_samples WHERE target_type='ACCESS_PORT' AND source_identity LIKE 'INT-SNMP-QDF-%';"               2>/dev/null || echo 0)"
            if [ "${rows:-0}" -gt 0 ]; then
              echo "SNMP_HISTORY_ROWS=$rows"
              break
            fi
            if [ "$i" = "45" ]; then exit 1; fi
            sleep 2
          done

      - name: Require SNMP trap spool delivery and industrial history
        run: |
          set -eu
          dc() {
            docker compose               --env-file infra/integration/integration.env               -f docker-compose.telemetry.yml               -f docker-compose.integration.yml "$@"
          }

          for i in $(seq 1 45); do
            if dc logs --no-color snmp-traps 2>&1 | grep -q '"event":"trap.delivery.committed"'; then
              break
            fi
            if [ "$i" = "45" ]; then
              echo "No committed controlled SNMP trap delivery"
              exit 1
            fi
            sleep 2
          done

          mongo_events="$(dc exec -T mongodb mongosh --quiet seed-01 --eval '
            print(db.industrial_events.countDocuments({sourceIdentity:"INT-TRAP-QDF-2",protocol:"SNMP"}));
          ' | tail -n 1)"
          if [ "${mongo_events:-0}" -lt 1 ]; then
            echo "No industrial Mongo trap events"
            exit 1
          fi
          echo "SNMP_TRAP_MONGO_EVENTS=$mongo_events"

          for i in $(seq 1 45); do
            rows="$(dc exec -T timescaledb psql -U site_mapper -d site_mapper_telemetry -Atc               "SELECT count(*) FROM industrial_observations WHERE source_identity='INT-TRAP-QDF-2' AND protocol='SNMP';"               2>/dev/null || echo 0)"
            if [ "${rows:-0}" -gt 0 ]; then
              echo "SNMP_TRAP_TIMESCALE_ROWS=$rows"
              break
            fi
            if [ "$i" = "45" ]; then
              echo "No industrial Timescale trap observations"
              exit 1
            fi
            sleep 2
          done

      - name: Require Modbus and operational surfaces
        run: |
          set -eu
          dc() {
            docker compose               --env-file infra/integration/integration.env               -f docker-compose.telemetry.yml               -f docker-compose.integration.yml "$@"
          }

          curl --fail --silent --show-error http://127.0.0.1:3000/login >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:3100/ >/dev/null

          dc exec -T modbus-tcp node -e '
            const m=JSON.parse(process.env.MODBUS_SOURCE_UNITS_JSON||"{}");
            if(m["26092403950003"]!==1 || m["26092403950004"]!==2 || m["26092403950002"]!==3) process.exit(1);
            console.log("MODBUS_MAP_OK");
          '

          dc ps

      - name: Diagnostics on failure
        if: failure()
        run: |
          docker compose             --env-file infra/integration/integration.env             -f docker-compose.telemetry.yml             -f docker-compose.integration.yml             ps || true
          docker compose             --env-file infra/integration/integration.env             -f docker-compose.telemetry.yml             -f docker-compose.integration.yml             logs --no-color --tail=300 || true

      - name: Dispose runner volumes
        if: always()
        run: |
          docker compose             --env-file infra/integration/integration.env             -f docker-compose.telemetry.yml             -f docker-compose.integration.yml             down -v --remove-orphans || true
