name: One-time ELTEK certification format
on:
  push:
    branches:
      - feat/certify-eltek-live-20261123

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout certification branch
        uses: actions/checkout@v7
        with:
          ref: feat/certify-eltek-live-20261123
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Format only certification-related files
        run: |
          npx prettier --write \
            docs/certification/eltek-smartpack-snmp-live-gate-2026-11-23.md \
            src/components/power/bdfb-telemetry-inspector.tsx \
            src/components/power/eltek-smartpack-live.tsx \
            src/modules/telemetry/application/eltek-live-presentation.ts \
            tests/unit/eltek-live-presentation.test.ts
      - name: Commit formatting to certification branch only
        run: |
          git add -- \
            docs/certification/eltek-smartpack-snmp-live-gate-2026-11-23.md \
            src/components/power/bdfb-telemetry-inspector.tsx \
            src/components/power/eltek-smartpack-live.tsx \
            src/modules/telemetry/application/eltek-live-presentation.ts \
            tests/unit/eltek-live-presentation.test.ts
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m 'style(eltek): format certification scope'
            git push origin HEAD:feat/certify-eltek-live-20261123
          fi
