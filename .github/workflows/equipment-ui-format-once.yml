name: Format Equipment UI once
on:
  push:
    branches:
      - feat/equipment-composition-contract-ui-20261022
    paths:
      - 'src/app/device/**'
      - 'src/app/equipment-composition-contract.css'
      - 'src/components/equipment/equipment-contract-views.tsx'
      - 'src/components/equipment/equipment-focus-inspector.tsx'
      - 'src/components/equipment/physical-equipment-diagram.tsx'
      - 'src/modules/telemetry/application/composition-telemetry-summary.ts'
      - 'tests/unit/equipment-contract-ui.test.tsx'
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format only changed Equipment UI sources
        run: |
          npx prettier --write \
            'src/app/device/[deviceId]/page.tsx' \
            'src/app/equipment-composition-contract.css' \
            'src/components/equipment/equipment-contract-views.tsx' \
            'src/components/equipment/equipment-focus-inspector.tsx' \
            'src/components/equipment/physical-equipment-diagram.tsx' \
            'src/modules/telemetry/application/composition-telemetry-summary.ts' \
            'tests/unit/equipment-contract-ui.test.tsx'
      - name: Commit formatter output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'src/app/device/[deviceId]/page.tsx' 'src/app/equipment-composition-contract.css' 'src/components/equipment/equipment-contract-views.tsx' 'src/components/equipment/equipment-focus-inspector.tsx' 'src/components/equipment/physical-equipment-diagram.tsx' 'src/modules/telemetry/application/composition-telemetry-summary.ts' 'tests/unit/equipment-contract-ui.test.tsx'
          if ! git diff --cached --quiet; then
            git commit -m 'style(ui): format Equipment composition implementation'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
