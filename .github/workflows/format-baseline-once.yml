name: One-time formatter for pre-existing CI baseline
on:
  push:
    branches: ['feat/snmp-field-production-parity']
    paths: ['.github/workflows/format-baseline-once.yml']
permissions:
  contents: write
jobs:
  format-existing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format only 24 files already flagged by CI
        run: |
          npx prettier --write \
            'docs/help/en/glosario.md' \
            'docs/help/es/glosario.md' \
            'src/app/device/[deviceId]/page.tsx' \
            'src/app/front-01.css' \
            'src/app/home-redesign.css' \
            'src/app/s03-workspace.css' \
            'src/app/site-mapper-brand.css' \
            'src/app/topology/[...path]/page.tsx' \
            'src/app/workbench/workbench.css' \
            'src/components/equipment/composition-history-charts.tsx' \
            'src/components/equipment/equipment-focus-inspector.tsx' \
            'src/components/power/bdfb-telemetry-inspector.tsx' \
            'src/components/power/snmp-feed-history.tsx' \
            'src/components/power/snmp-feed-load-panel.tsx' \
            'src/components/topology/context-tree.tsx' \
            'src/components/workbench/breaker-load-report-workbench.tsx' \
            'src/components/workbench/qdf-load-report-workbench.tsx' \
            'src/components/workspace/front-01-bdfb-health.tsx' \
            'src/components/workspace/front-01-bdfb-summary.tsx' \
            'src/components/workspace/front-01-equipment-summary.tsx' \
            'src/components/workspace/front-01-stage-tabs.tsx' \
            'src/components/workspace/resizable-workspace.tsx' \
            'src/modules/alarm/application/telemetry-alarm-evaluator.ts' \
            'src/modules/help/catalog.ts'
      - name: Commit formatter-only baseline
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "docs/help/en/glosario.md" "docs/help/es/glosario.md" "src/app/device/[deviceId]/page.tsx" "src/app/front-01.css" "src/app/home-redesign.css" "src/app/s03-workspace.css" "src/app/site-mapper-brand.css" "src/app/topology/[...path]/page.tsx" "src/app/workbench/workbench.css" "src/components/equipment/composition-history-charts.tsx" "src/components/equipment/equipment-focus-inspector.tsx" "src/components/power/bdfb-telemetry-inspector.tsx" "src/components/power/snmp-feed-history.tsx" "src/components/power/snmp-feed-load-panel.tsx" "src/components/topology/context-tree.tsx" "src/components/workbench/breaker-load-report-workbench.tsx" "src/components/workbench/qdf-load-report-workbench.tsx" "src/components/workspace/front-01-bdfb-health.tsx" "src/components/workspace/front-01-bdfb-summary.tsx" "src/components/workspace/front-01-equipment-summary.tsx" "src/components/workspace/front-01-stage-tabs.tsx" "src/components/workspace/resizable-workspace.tsx" "src/modules/alarm/application/telemetry-alarm-evaluator.ts" "src/modules/help/catalog.ts"
          if ! git diff --cached --quiet; then
            git commit -m 'style: normalize pre-existing Prettier baseline (24 files)'
            git push origin HEAD:feat/snmp-field-production-parity
          fi
