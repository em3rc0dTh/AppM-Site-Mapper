name: One-time final Config4 test formatting
on:
  push:
    branches: [main]
    paths: ['.github/workflows/format-config4-final-once.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write tests/unit/bdfb-config4.test.ts
      - name: Commit formatted regression
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tests/unit/bdfb-config4.test.ts
            git commit -m "style(bdfb): format empty-inventory regression"
            git push origin HEAD:main
          fi
