name: Temporary Mongo launcher formatter
on:
  push:
    branches: [feat/mk1-raw-build]
    paths: ['.github/workflows/format-mongo-temp.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/mk1-raw-build
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write .
      - name: Commit only real formatting differences
        run: |
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: normalize Mongo MQTT launcher"
          git push origin HEAD:feat/mk1-raw-build
