name: Temporary Rule Manager formatting
on:
  push:
    branches:
      - feat/alarm-rule-manager-dc48v-mk1

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/alarm-rule-manager-dc48v-mk1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format only files changed in this branch
        run: |
          git diff --name-only -z origin/main...HEAD -- '*.ts' '*.tsx' '*.css' |
            xargs -0 -r ./node_modules/.bin/prettier --write
          git add -- '*.ts' '*.tsx' '*.css'
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'style(alarms): apply repository Prettier formatting'
            git push origin HEAD:feat/alarm-rule-manager-dc48v-mk1
          fi
