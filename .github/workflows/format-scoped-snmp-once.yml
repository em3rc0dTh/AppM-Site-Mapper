name: Format scoped SNMP security once
on:
  push:
    branches: [security/snmp-production-auth-20261021]
    paths: ['.github/workflows/format-scoped-snmp-once.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/snmp-production-auth-20261021
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write docs/operations/environment-reference.md docs/security/snmp-adversarial-audit-2026-10-21.md docs/telemetry/snmp-feed-ingestion.md src/app/api/telemetry/snmp/ingest/route.ts src/modules/telemetry/application/snmp-ingest-credentials.ts tests/unit/snmp-production-security.test.ts
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "style(security): format source-scoped SNMP credential hardening"
            git push origin HEAD:security/snmp-production-auth-20261021
          fi
