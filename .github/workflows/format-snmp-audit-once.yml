name: One-time SNMP audit formatting
on:
  push:
    branches:
      - security/snmp-adversarial-certification-20261021
    paths:
      - '.github/workflows/format-snmp-audit-once.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/snmp-adversarial-certification-20261021
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write src/modules/telemetry/application/snmp-feed-service.ts src/modules/telemetry/application/telemetry-history-writer.ts src/modules/telemetry/domain/snmp-feed.ts tests/unit/snmp-adversarial-security.test.ts scripts/ci/http-operational-journey.mjs scripts/ci/http-operational-restart.mjs .github/workflows/snmp-adversarial-security.yml
      - name: Commit formatted source
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "style(security): format SNMP adversarial hardening and tests"
            git push origin HEAD:security/snmp-adversarial-certification-20261021
          fi
