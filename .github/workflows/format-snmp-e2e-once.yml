name: Format SNMP E2E once
on:
  push:
    branches: [feat/snmp-feed-operational-readiness]
    paths:
      - '.github/workflows/format-snmp-e2e-once.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/snmp-feed-operational-readiness
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write scripts/ci/http-operational-journey.mjs scripts/ci/http-operational-restart.mjs .github/workflows/operational-http-e2e.yml src/app/api/telemetry/snmp/ingest/route.ts
      - name: Commit formatting changes
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "style(snmp): format operational HTTP acceptance and error route"
            git push origin HEAD:feat/snmp-feed-operational-readiness
          fi
