name: Format SNMP readiness once
on:
  push:
    branches: [feat/snmp-feed-operational-readiness]
    paths:
      - '.github/workflows/format-snmp-readiness-once.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/snmp-feed-operational-readiness
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write src/app/api/equipment/'[id]'/access-ports/route.ts src/app/api/telemetry/snmp/commission/route.ts src/app/api/telemetry/snmp/feeds/route.ts src/components/equipment/access-port-editor.tsx src/components/power/snmp-feed-commissioning.tsx src/components/power/snmp-feed-load-panel.tsx src/components/power/bdfb-telemetry-inspector.tsx src/modules/topology/application/access-port-service.ts src/modules/telemetry/application/snmp-feed-service.ts src/modules/telemetry/application/telemetry-history-writer.ts src/modules/telemetry/infrastructure/http-telemetry-store.ts tests/unit/snmp-feed.test.ts docs/telemetry/snmp-feed-ingestion.md docker-compose.telemetry.yml
      - name: Commit only formatted source changes
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "style(snmp): format operational readiness files"
            git push origin HEAD:feat/snmp-feed-operational-readiness
          fi
