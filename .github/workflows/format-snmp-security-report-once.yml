name: Format SNMP security audit once
on:
  push:
    branches: [security/snmp-adversarial-certification-20261021]
    paths: ['.github/workflows/format-snmp-security-report-once.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/snmp-adversarial-certification-20261021
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write docs/security/snmp-adversarial-audit-2026-10-21.md infra/snmp-collector/adversarial-wire.test.mjs .github/workflows/snmp-adversarial-security.yml
      - name: Commit formatted files
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "style(security): format SNMP protocol audit evidence"
            git push origin HEAD:security/snmp-adversarial-certification-20261021
          fi
