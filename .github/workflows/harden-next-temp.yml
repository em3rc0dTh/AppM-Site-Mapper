name: Temporary Next.js critical-advisory fix
on:
  push:
    branches: [feat/mk1-raw-build]
    paths:
      - .github/workflows/harden-next-temp.yml
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/mk1-raw-build
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Pin first patched Next.js and matching ESLint config
        run: npm install next@16.3.8 eslint-config-next@16.3.8 --save-exact --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify immutable install
        run: npm ci --no-audit --no-fund
      - name: Verify critical/high production vulnerabilities are cleared
        run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npx prettier --write package.json
      - name: Commit reviewed dependency update
        run: |
          if git diff --quiet -- package.json package-lock.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "security: pin Next.js 16.3.8 to address critical ImageResponse advisory"
          git push origin HEAD:feat/mk1-raw-build
