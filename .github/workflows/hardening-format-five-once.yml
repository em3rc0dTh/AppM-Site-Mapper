name: Hardening format five once
on:
  push:
    branches:
      - merge/mk1-hardening-into-main-2026-10-26
    paths:
      - '.github/workflows/hardening-format-five-once.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format remaining integration files
        run: |
          npx prettier --write             docs/operations/mk1-critical-hardening-2026-10-26.md             scripts/migrations/legacy/promote.ts             src/modules/power/infrastructure/mongo-power-repository.ts             src/modules/telemetry/infrastructure/mongo-telemetry-binding-repository.ts             src/shared/infrastructure/mongodb/reference-guards.ts
      - name: Remove workflow and commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/hardening-format-five-once.yml
          git add             docs/operations/mk1-critical-hardening-2026-10-26.md             scripts/migrations/legacy/promote.ts             src/modules/power/infrastructure/mongo-power-repository.ts             src/modules/telemetry/infrastructure/mongo-telemetry-binding-repository.ts             src/shared/infrastructure/mongodb/reference-guards.ts
          git commit -m "style(hardening): format final reconciled files"
          git push origin HEAD:refs/heads/merge/mk1-hardening-into-main-2026-10-26
