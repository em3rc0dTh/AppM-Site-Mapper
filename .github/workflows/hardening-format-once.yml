name: Hardening format once
on:
  push:
    branches:
      - merge/mk1-hardening-into-main-2026-10-26
    paths:
      - '.github/workflows/hardening-format-once.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format integration diff only
        run: |
          git diff -z --name-only origin/main...HEAD -- '*.ts' '*.md' '*.json' |
            xargs -0 -r npx prettier --write
          npx prettier --write README.md .env.example
      - name: Remove this one-time workflow and commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/hardening-format-once.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No formatting changes"
          else
            git commit -m "style(hardening): format reconciled MK1 integration"
            git push origin HEAD:refs/heads/merge/mk1-hardening-into-main-2026-10-26
          fi
