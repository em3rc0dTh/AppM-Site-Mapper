name: Help beginner quality once
on:
  push:
    branches:
      - feat/mk1-in-app-help-manual-2026-10-26
    paths:
      - '.github/workflows/help-beginner-quality-once.yml'
permissions:
  contents: write
jobs:
  help-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format Help Center scope
        run: |
          npx prettier --write \
            src/modules/help/catalog.ts \
            src/modules/help/components/help-explorer.tsx \
            src/modules/help/components/markdown-article.tsx \
            src/app/help.css \
            src/messages/es.json src/messages/en.json \
            tests/unit/help-catalog.test.ts \
            docs/user-guide/help-center-integrado.md \
            docs/help/es/*.md docs/help/en/*.md
      - name: Run Help Center unit contract
        run: npx vitest run tests/unit/help-catalog.test.ts
      - name: Commit formatting if required
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/modules/help/catalog.ts \
            src/modules/help/components/help-explorer.tsx \
            src/modules/help/components/markdown-article.tsx \
            src/app/help.css src/messages/es.json src/messages/en.json \
            tests/unit/help-catalog.test.ts docs/user-guide/help-center-integrado.md docs/help
          if git diff --cached --quiet; then
            echo "No formatting changes"
          else
            git commit -m "style(help): format beginner-first Help Center"
            git push origin HEAD:refs/heads/feat/mk1-in-app-help-manual-2026-10-26
          fi
