name: Help screenshot quality once
on:
  push:
    branches:
      - feat/mk1-in-app-help-manual-2026-10-26
    paths:
      - '.github/workflows/help-screenshot-quality-once.yml'
permissions:
  contents: write
jobs:
  validate-help:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format Help Center changes
        run: |
          npx prettier --write \
            src/modules/help/catalog.ts \
            src/modules/help/components/help-explorer.tsx \
            src/modules/help/components/markdown-article.tsx \
            src/app/help.css \
            tests/unit/help-catalog.test.ts \
            docs/product/help-real-screenshot-map-v1.md \
            docs/help/es/*.md docs/help/en/*.md
      - name: Validate Help Center
        run: npx vitest run tests/unit/help-catalog.test.ts
      - name: Commit formatting if needed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/modules/help/catalog.ts \
            src/modules/help/components/help-explorer.tsx \
            src/modules/help/components/markdown-article.tsx \
            src/app/help.css tests/unit/help-catalog.test.ts \
            docs/product/help-real-screenshot-map-v1.md docs/help
          if git diff --cached --quiet; then
            echo "No formatting changes"
          else
            git commit -m "style(help): format full-resolution visual guides"
            git push origin HEAD:refs/heads/feat/mk1-in-app-help-manual-2026-10-26
          fi
