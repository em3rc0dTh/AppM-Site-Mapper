name: One-time Home + SNMP formatting
on:
  push:
    branches:
      - feat/home-bdfb-system-overview
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/home-bdfb-system-overview
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prettier --write .
      - name: Save formatting in existing PR branch
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "style(home): format combined BDFB and SNMP changes"
            git push origin HEAD:feat/home-bdfb-system-overview
          fi
