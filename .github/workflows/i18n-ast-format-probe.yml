name: i18n AST test format probe (read-only)
on:
  push:
    paths:
      - .github/workflows/i18n-ast-format-probe.yml
permissions:
  contents: read
jobs:
  format:
    if: github.ref == 'refs/heads/chore/english-ui-baseline-20261022'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Render formatted test without changing repository
        run: |
          ./node_modules/.bin/prettier --write tests/unit/i18n-static-ui.test.ts
          echo 'AST_FORMAT_BEGIN'
          echo "FORMATTED|tests/unit/i18n-static-ui.test.ts|$(base64 -w0 tests/unit/i18n-static-ui.test.ts)"
          echo 'AST_FORMAT_END'
