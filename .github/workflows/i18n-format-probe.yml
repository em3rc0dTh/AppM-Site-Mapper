name: i18n formatting probe (read-only)
on:
  push:
    paths:
      - .github/workflows/i18n-format-probe.yml
permissions:
  contents: read
jobs:
  show-formatted-files:
    if: github.ref == 'refs/heads/chore/english-ui-baseline-20261022'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Render repository formatting without writing to GitHub
        shell: bash
        run: |
          node <<'NODE'
          const cp = require('node:child_process');
          const fs = require('node:fs');
          const paths = cp.execFileSync('git', ['diff','origin/main...HEAD','--name-only'], {encoding:'utf8'}).trim().split('\n')
            .filter(p=>/\.(tsx?|jsx?|json|css|md|ya?ml)$/.test(p) && fs.existsSync(p));
          const prior = new Map(paths.map(p=>[p,fs.readFileSync(p).toString('base64')]));
          cp.execFileSync('./node_modules/.bin/prettier', ['--write', ...paths], {stdio:'pipe',maxBuffer:10*1024*1024});
          let count=0;
          console.log('I18N_FORMAT_BEGIN');
          for(const path of paths){
            const b64=fs.readFileSync(path).toString('base64');
            if(b64!==prior.get(path)){console.log('FORMATTED|'+path+'|'+b64);count++}
          }
          console.log('I18N_FORMAT_END');
          console.log('FORMATTED_FILE_COUNT '+count);
          NODE
