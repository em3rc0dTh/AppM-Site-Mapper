name: i18n residual audit (temporary read-only)
on:
  push:
    paths:
      - .github/workflows/i18n-residual-audit.yml
permissions:
  contents: read
jobs:
  scan:
    if: github.ref == 'refs/heads/chore/english-ui-baseline-20261022'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Enumerate untranslated JSX labels
        shell: bash
        run: |
          node <<'NODE'
          const ts = require('typescript');
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const paths = cp.execFileSync('git', ['ls-files', '--', 'src'], {encoding:'utf8'}).trim().split('\n')
            .filter(p=>p.endsWith('.tsx') && !p.startsWith('src/app/api/'));
          const technical = /^(?:BDFB|SNMP|MQTT|OID|MODBUS|kWh|kW|mm|A|B|V|W|U|DC|AC|ID|JSON|HTTP|CAS|LIVE|RAW|\d+[A-Z]?)$/;
          let count = 0, byFile = {};
          for(const path of paths){
            const src = fs.readFileSync(path, 'utf8');
            const sf = ts.createSourceFile(path,src,ts.ScriptTarget.Latest,true,ts.ScriptKind.TSX);
            const lines=[];
            const report=(n, kind, value)=>{
              const text=value.replace(/\s+/g,' ').trim();
              if(text.length<3 || !/[a-zA-Z]{3}/.test(text) || technical.test(text))return;
              const line=sf.getLineAndCharacterOfPosition(n.getStart(sf)).line+1;
              lines.push({line,kind,text:text.slice(0,160)});
            };
            function visit(node) {
              if(ts.isJsxText(node))report(node,'text',node.getText(sf));
              if(ts.isJsxAttribute(node) && /^(?:aria-label|placeholder|title|alt|aria-description)$/.test(node.name.text) && node.initializer && ts.isStringLiteral(node.initializer))
                report(node,'attribute',node.initializer.text);
              if(ts.isJsxExpression(node)&&node.expression&&ts.isStringLiteral(node.expression))
                report(node,'expression',node.expression.text);
              ts.forEachChild(node,visit);
            }
            visit(sf);
            if(lines.length){byFile[path]=lines;count+=lines.length}
          }
          console.log('I18N_AUDIT_BEGIN');
          console.log(JSON.stringify({filesScanned:paths.length,count,byFile}));
          console.log('I18N_AUDIT_END');
          NODE
