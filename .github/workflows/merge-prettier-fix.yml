name: Temporary Merge Prettier Fix

on:
  push:
    branches:
      - feat/s01-breaker-context-popover
    paths:
      - 'src/app/device/[deviceId]/page.tsx'
      - 'src/components/power/breaker-limit-editor.css'
      - '.github/workflows/merge-prettier-fix.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/s01-breaker-context-popover
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format changed files
        run: npx prettier --write "src/app/device/[deviceId]/page.tsx" src/components/power/breaker-limit-editor.css
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "src/app/device/[deviceId]/page.tsx" src/components/power/breaker-limit-editor.css
          git commit -m "style(ui): apply repository Prettier before merge"
          git push origin HEAD:feat/s01-breaker-context-popover
