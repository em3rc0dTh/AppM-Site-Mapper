name: MK1 chaos test formatter once
on:
  push:
    branches: [test/mk1-adversarial-wheel-2026-10-26]
    paths:
      - '.github/workflows/mk1-chaos-format-once.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: |
          npx prettier --write \
            tests/integration/mk1-mqtt-infrastructure-chaos.test.ts \
            tests/integration/mk1-mongo-infrastructure-chaos.test.ts \
            tests/integration/mk1-spool-infrastructure-chaos.test.ts \
            .github/workflows/mk1-infrastructure-chaos.yml
      - name: Commit formatted fault-injection tests
        run: |
          git add -- tests/integration/mk1-mqtt-infrastructure-chaos.test.ts \
            tests/integration/mk1-mongo-infrastructure-chaos.test.ts \
            tests/integration/mk1-spool-infrastructure-chaos.test.ts \
            .github/workflows/mk1-infrastructure-chaos.yml
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style(chaos): format fault-injection tests'
          git push origin HEAD:refs/heads/test/mk1-adversarial-wheel-2026-10-26
