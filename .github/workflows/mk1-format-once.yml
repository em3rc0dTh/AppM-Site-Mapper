name: MK1 temporary branch formatter
on:
  push:
    branches:
      - feat/mk1-audited-recursive-deletion-2026-10-27
    paths:
      - .github/workflows/mk1-format-once.yml
permissions:
  contents: write
jobs:
  fix-format:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/mk1-audited-recursive-deletion-2026-10-27
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format only the eight CI-reported files
        run: |
          npx prettier --write \
            'src/app/api/topology/[id]/delete/route.ts' \
            'src/app/blueprint/[roomId]/page.tsx' \
            'src/app/device/[deviceId]/page.tsx' \
            'src/components/blueprint/room-layout-editor.tsx' \
            'src/components/equipment/equipment-composition-editor.tsx' \
            'src/components/topology/delete-entity-control.tsx' \
            'src/modules/rack/application/rack-elevation-service.ts' \
            'src/modules/topology/application/topology-deletion-service.ts'
      - name: Commit formatting only on feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            'src/app/api/topology/[id]/delete/route.ts' \
            'src/app/blueprint/[roomId]/page.tsx' \
            'src/app/device/[deviceId]/page.tsx' \
            'src/components/blueprint/room-layout-editor.tsx' \
            'src/components/equipment/equipment-composition-editor.tsx' \
            'src/components/topology/delete-entity-control.tsx' \
            'src/modules/rack/application/rack-elevation-service.ts' \
            'src/modules/topology/application/topology-deletion-service.ts'
          if ! git diff --cached --quiet; then
            git commit -m "style(mk1): apply Prettier to audited deletion files"
            git push origin HEAD:feat/mk1-audited-recursive-deletion-2026-10-27
          fi
