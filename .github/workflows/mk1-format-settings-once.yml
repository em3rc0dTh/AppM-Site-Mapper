name: MK1 temporary settings formatter
on:
  push:
    branches:
      - feat/mk1-audited-recursive-deletion-2026-10-27
    paths:
      - .github/workflows/mk1-format-settings-once.yml
permissions:
  contents: write
jobs:
  format-settings:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/mk1-audited-recursive-deletion-2026-10-27
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format settings fix and regression
        run: |
          npx prettier --write \
            src/app/settings/page.tsx \
            src/modules/settings/domain/settings-access.ts \
            tests/unit/settings-access.test.ts \
            scripts/ci/http-operational-journey.mjs \
            scripts/ci/browser-operational-journey.mjs
      - name: Commit formatted files to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            src/app/settings/page.tsx \
            src/modules/settings/domain/settings-access.ts \
            tests/unit/settings-access.test.ts \
            scripts/ci/http-operational-journey.mjs \
            scripts/ci/browser-operational-journey.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style(settings): normalize formatting for role-safe navigation"
            git push origin HEAD:feat/mk1-audited-recursive-deletion-2026-10-27
          fi
