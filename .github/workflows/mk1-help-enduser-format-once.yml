name: Format customer Help Center once
on:
  push:
    branches:
      - feat/mk1-in-app-help-manual-2026-10-26
    paths:
      - '.github/workflows/mk1-help-enduser-format-once.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install pinned formatter
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format user guide and renderer
        run: |
          npx prettier --write             src/modules/help/catalog.ts             src/modules/help/server.ts             src/modules/help/components/markdown-article.tsx             'src/app/help/[slug]/page.tsx'             src/app/help.css             src/messages/en.json src/messages/es.json             next.config.ts tests/unit/help-catalog.test.ts             docs/user-guide/README.md docs/user-guide/help-center-integrado.md             docs/help/es/*.md docs/help/en/*.md
      - name: Commit formatted files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/modules/help/catalog.ts src/modules/help/server.ts             src/modules/help/components/markdown-article.tsx             'src/app/help/[slug]/page.tsx' src/app/help.css             src/messages/en.json src/messages/es.json             next.config.ts tests/unit/help-catalog.test.ts             docs/user-guide/README.md docs/user-guide/help-center-integrado.md docs/help
          if git diff --cached --quiet; then
            echo 'Already formatted'
          else
            git commit -m 'style(help): format friendly multilingual end-user manual'
            git push origin HEAD:refs/heads/feat/mk1-in-app-help-manual-2026-10-26
          fi
