name: MK1 red-team formatter (one shot)
on:
  push:
    branches: [test/mk1-adversarial-wheel-2026-10-26]
    paths:
      - '.github/workflows/mk1-redteam-format-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format red-team probe without modifying product code
        run: npx prettier --write scripts/ci/mk1-adversarial-http.mjs
      - name: Commit just the formatted script
        run: |
          git add -- scripts/ci/mk1-adversarial-http.mjs
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style(ci): format isolated red-team probe'
          git push origin HEAD:refs/heads/test/mk1-adversarial-wheel-2026-10-26
