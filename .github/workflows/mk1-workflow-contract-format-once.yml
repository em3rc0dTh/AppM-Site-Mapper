name: Format workflow contract once
on:
  push:
    branches:
      - feat/mk1-in-app-help-manual-2026-10-26
    paths:
      - '.github/workflows/mk1-workflow-contract-format-once.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format three internal workflow specifications
        run: |
          npx prettier --write \
            docs/product/help-workflow-contract-v1.md \
            docs/product/help-workflow-master-map-v2.md \
            docs/product/help-workflows-industrial-detail-v2.md
      - name: Commit format
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+users.noreply.github.com'
          git add docs/product/help-workflow-contract-v1.md \
            docs/product/help-workflow-master-map-v2.md \
            docs/product/help-workflows-industrial-detail-v2.md
          if git diff --cached --quiet; then
            echo "Already formatted"
          else
            git commit -m "style(docs): format Site Mapper workflow contracts"
            git push origin HEAD:refs/heads/feat/mk1-in-app-help-manual-2026-10-26
          fi
