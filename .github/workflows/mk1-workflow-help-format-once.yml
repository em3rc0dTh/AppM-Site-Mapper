name: Format workflow Help Center once
on:
  push:
    branches:
      - feat/mk1-in-app-help-manual-2026-10-26
    paths:
      - '.github/workflows/mk1-workflow-help-format-once.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install pinned formatter
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format workflow guides and navigation
        run: |
          npx prettier --write \
            src/modules/help/catalog.ts \
            src/modules/help/components/help-explorer.tsx \
            src/modules/help/components/markdown-article.tsx \
            src/modules/help/server.ts \
            'src/app/help/[slug]/page.tsx' \
            src/app/help.css \
            src/messages/en.json src/messages/es.json \
            tests/unit/help-catalog.test.ts \
            docs/user-guide/help-center-integrado.md \
            docs/help/es/*.md docs/help/en/*.md
      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/modules/help/catalog.ts \
            src/modules/help/components/help-explorer.tsx \
            src/modules/help/components/markdown-article.tsx \
            src/modules/help/server.ts \
            'src/app/help/[slug]/page.tsx' \
            src/app/help.css src/messages/en.json src/messages/es.json \
            tests/unit/help-catalog.test.ts \
            docs/user-guide/help-center-integrado.md docs/help
          if git diff --cached --quiet; then
            echo "No formatting changes"
          else
            git commit -m "style(help): format workflow-led bilingual Help Center"
            git push origin HEAD:refs/heads/feat/mk1-in-app-help-manual-2026-10-26
          fi
