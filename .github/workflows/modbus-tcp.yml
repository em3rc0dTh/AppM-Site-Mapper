name: Site Mapper Modbus TCP certification
on:
  push:
    branches:
      - 'feat/modbus-tcp-site-mapper-sidecar'
      - main
    paths:
      - 'infra/modbus-tcp/**'
      - 'scripts/operations/generate-metasys-register-map.mjs'
      - 'docs/telemetry/metasys-register-map.csv'
      - 'src/modules/telemetry/infrastructure/telemetry-runtime.ts'
      - 'src/modules/telemetry/application/metasys-eltek-modbus-projection.ts'
      - 'src/modules/telemetry/infrastructure/industrial/publication.ts'
      - 'src/app/api/telemetry/industrial/projection/route.ts'
      - 'config/industrial/modbus-points.metasys-eltek-v1.2.json'
      - 'tests/unit/metasys-eltek-modbus-projection.test.ts'
      - '.github/workflows/modbus-tcp.yml'
      - 'docker-compose.telemetry.yml'
  pull_request:
    paths:
      - '.github/uat-verification.json'
      - 'infra/modbus-tcp/**'
      - 'scripts/operations/generate-metasys-register-map.mjs'
      - 'docs/telemetry/metasys-register-map.csv'
      - 'src/modules/telemetry/infrastructure/telemetry-runtime.ts'
      - 'src/modules/telemetry/application/metasys-eltek-modbus-projection.ts'
      - 'src/modules/telemetry/infrastructure/industrial/publication.ts'
      - 'src/app/api/telemetry/industrial/projection/route.ts'
      - 'config/industrial/modbus-points.metasys-eltek-v1.2.json'
      - 'tests/unit/metasys-eltek-modbus-projection.test.ts'
      - '.github/workflows/modbus-tcp.yml'

permissions:
  contents: read

jobs:
  modbus:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund
      - name: Test Metasys Eltek 17-point Site Mapper projection
        run: npx vitest run tests/unit/metasys-eltek-modbus-projection.test.ts
      - name: Lint Metasys Eltek projection changes
        run: |
          npx eslint             src/modules/telemetry/application/metasys-eltek-modbus-projection.ts             src/modules/telemetry/infrastructure/industrial/publication.ts             src/modules/telemetry/infrastructure/http-telemetry-store.ts             src/app/api/telemetry/industrial/projection/route.ts             tests/unit/metasys-eltek-modbus-projection.test.ts
      - name: Format-check Metasys Eltek contract changes
        run: |
          npx prettier --check             .github/workflows/modbus-tcp.yml             config/industrial/modbus-points.metasys-eltek-v1.2.json             docs/telemetry/modbus-tcp-output.md             infra/modbus-tcp/point-registry.mjs             infra/modbus-tcp/point-registry.test.mjs             src/modules/telemetry/application/metasys-eltek-modbus-projection.ts             src/modules/telemetry/infrastructure/industrial/publication.ts             src/modules/telemetry/infrastructure/http-telemetry-store.ts             src/app/api/telemetry/industrial/projection/route.ts             tests/unit/metasys-eltek-modbus-projection.test.ts
      - name: Test durable incremental SNMP energy projection
        run: |
          python3 -m py_compile infra/telemetry-store/app.py
          python3 -m unittest discover -s infra/telemetry-store -p 'test_entity_history.py'
      - name: Test 96 circuits, FLOAT32, UINT16 extensions, 3 Unit IDs and real TCP reader
        run: node --test infra/modbus-tcp/server.test.mjs
      - name: Check committed Metasys register table against runtime map
        run: node scripts/operations/generate-metasys-register-map.mjs --check
