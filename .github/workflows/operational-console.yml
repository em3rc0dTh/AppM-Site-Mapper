# Archived component: manual source checks only. No image build or deployment.
name: Operational Console legacy source checks (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  console-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install archived source dependencies
        working-directory: infra/operational-console
        run: npm install --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Archived unit and HTTP tests
        working-directory: infra/operational-console
        run: npm test
