name: MK1 HTTP & MongoDB operational acceptance

on:
  push:
    branches:
      - main
      - 'test/adversarial-g10-cross-target-20261013'
      - 'feat/full-power-trace-access-ports'
    paths:
      - 'scripts/ci/http-operational-journey.mjs'
      - 'scripts/ci/http-operational-restart.mjs'
      - 'scripts/ci/browser-operational-journey.mjs'
      - '.github/workflows/operational-http-e2e.yml'
      - 'src/app/api/**'
      - 'src/modules/topology/**'
      - 'src/modules/power/**'
      - 'src/modules/telemetry/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  http-mongo-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: test
      APP_PERSISTENCE: mongodb
      MONGODB_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
      MONGODB_DB_NAME: site_mapper_http_ci_${{ github.run_id }}
      BOOTSTRAP_ADMIN_TOKEN: isolated-mk1-http-ci-token
      CI_HTTP_ACCEPTANCE: 'true'
      CI_COMBINED_E2E: 'true'
      TELEMETRY_ENABLED: 'true'
      MQTT_BROKER_URL: mqtt://127.0.0.1:1883
      MQTT_TOPIC_FILTER: data/dev/#
      TELEMETRY_HISTORY_ENABLED: 'true'
      TELEMETRY_STORE_URL: http://127.0.0.1:18081
      TELEMETRY_STORE_TOKEN: mk1-ci-isolated-store-secret
      CI_HTTP_BASE_URL: http://127.0.0.1:3100

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund

      - name: Start a disposable MongoDB replica set
        run: |
          docker run -d --name mk1-e2e-mongo -p 127.0.0.1:27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in {1..45}; do
            if docker exec mk1-e2e-mongo mongosh --quiet --eval 'db.adminCommand({ping:1})' 2>/dev/null; then
              break
            fi
            sleep 2
          done
          docker exec mk1-e2e-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for i in {1..45}; do
            if docker exec mk1-e2e-mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; then
              exit 0
            fi
            sleep 2
          done
          echo 'Mongo replica set failed to become primary.'
          exit 1

      - name: Start real Mosquitto broker
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y mosquitto mosquitto-clients
          sudo systemctl restart mosquitto
          for i in {1..20}; do
            if timeout 1 bash -c '</dev/tcp/127.0.0.1/1883' 2>/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1

      - name: Start TimescaleDB and telemetry-store
        run: |
          docker compose -f docker-compose.telemetry.yml up -d --build
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:18081/health; then exit 0; fi
            sleep 2
          done
          docker compose -f docker-compose.telemetry.yml logs --tail=60
          exit 1

      - name: Build actual Next.js application
        run: npm run build

      - name: Start application against disposable MongoDB
        run: |
          npm run dev -- -H 127.0.0.1 -p 3100 > /tmp/mk1-http-e2e.log 2>&1 &
          echo $! > /tmp/mk1-http-e2e.pid

      - name: Create Sites, Equipment, PowerPaths and commissioning via HTTP
        run: node scripts/ci/http-operational-journey.mjs

      - name: Install isolated Chromium automation
        run: |
          npm install --prefix /tmp/mk1-playwright --no-save --no-audit --no-fund playwright@1.56.1
          /tmp/mk1-playwright/node_modules/.bin/playwright install --with-deps chromium

      - name: Exercise real browser login and Equipment UI
        run: node scripts/ci/browser-operational-journey.mjs

      - name: Restart Next.js and certify persisted inventory and history
        run: |
          kill "$(cat /tmp/mk1-http-e2e.pid)" || true
          sudo fuser -k 3100/tcp || true
          sleep 2
          if curl -fsS http://127.0.0.1:3100/api/health; then
            echo 'Old Next.js process still serves requests; restart was not verified.'
            exit 1
          fi
          npm run dev -- -H 127.0.0.1 -p 3100 > /tmp/mk1-http-e2e-restart.log 2>&1 &
          echo $! > /tmp/mk1-http-e2e.pid
          node scripts/ci/http-operational-restart.mjs

      - name: Verify canonical MongoDB integrity
        run: npm run audit:mongo -- --expect-db=${{ env.MONGODB_DB_NAME }}

      - name: Print sanitized application diagnostics on failure
        if: failure()
        run: |
          if [ -f /tmp/mk1-http-e2e.log ]; then
            grep -E 'Error|error|Failed|POST /api/|PATCH /api/|GET /api/' /tmp/mk1-http-e2e.log | tail -100 || true
          fi
          docker logs --tail 35 mk1-e2e-mongo 2>&1 | grep -E 'ERROR|Error|FATAL' || true

      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mk1-browser-evidence
          path: /tmp/mk1-operational-browser.png
          if-no-files-found: ignore

      - name: Cleanup disposable services
        if: always()
        run: |
          docker compose -f docker-compose.telemetry.yml down -v || true
          docker rm -f mk1-e2e-mongo || true
