name: Temporary Power Trace formatting
on:
  push:
    branches:
      - feat/power-trace-window-v2-2026-11-16
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/power-trace-window-v2-2026-11-16
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format changed Power Trace files
        run: |
          npx prettier --write \
            src/components/power/full-power-trace-modal.tsx \
            src/components/workbench/full-power-trace-workbench.tsx \
            src/app/workbench/power-trace.css \
            src/app/workbench/power-trace/page.tsx \
            src/app/workbench/layout.tsx \
            src/modules/power/application/full-power-trace-service.ts \
            tests/integration/full-power-trace-service.test.ts \
            docs/ui/power-trace-v2.1.md
      - name: Commit formatting on feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            src/components/power/full-power-trace-modal.tsx \
            src/components/workbench/full-power-trace-workbench.tsx \
            src/app/workbench/power-trace.css \
            src/app/workbench/power-trace/page.tsx \
            src/app/workbench/layout.tsx \
            src/modules/power/application/full-power-trace-service.ts \
            tests/integration/full-power-trace-service.test.ts \
            docs/ui/power-trace-v2.1.md
          if ! git diff --cached --quiet; then
            git commit -m "style(power): format detached trace workbench"
            git push origin HEAD:feat/power-trace-window-v2-2026-11-16
          fi
