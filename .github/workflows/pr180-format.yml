name: Temporary PR formatter
on:
  push:
    branches:
      - feat/modbus-excel-v1-2-alignment-2026-11-06

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/modbus-excel-v1-2-alignment-2026-11-06
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format changed contract files
        run: |
          npx prettier --write             docs/telemetry/metasys-register-map.md             infra/modbus-tcp/server.test.mjs             src/modules/telemetry/domain/bfdb-bound-point.ts             src/modules/telemetry/domain/bfdb-wire-layout.ts             src/modules/telemetry/domain/bfdb.ts             src/modules/telemetry/infrastructure/telemetry-runtime.ts             tests/unit/bfdb-wire-layout.test.ts
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             docs/telemetry/metasys-register-map.md             infra/modbus-tcp/server.test.mjs             src/modules/telemetry/domain/bfdb-bound-point.ts             src/modules/telemetry/domain/bfdb-wire-layout.ts             src/modules/telemetry/domain/bfdb.ts             src/modules/telemetry/infrastructure/telemetry-runtime.ts             tests/unit/bfdb-wire-layout.test.ts
          git commit -m "style: apply repository Prettier to Modbus v1.2 alignment"
          git push origin HEAD:feat/modbus-excel-v1-2-alignment-2026-11-06
