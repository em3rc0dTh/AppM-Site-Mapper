name: Temporary PR 182 formatter
on:
  push:
    branches:
      - fix/http-mqtt-live-field-alias-2026-11-06
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/http-mqtt-live-field-alias-2026-11-06
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write src/modules/telemetry/domain/bfdb-wire-layout.ts tests/unit/bfdb-bound-point.test.ts tests/unit/bfdb-wire-layout.test.ts
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/telemetry/domain/bfdb-wire-layout.ts tests/unit/bfdb-bound-point.test.ts tests/unit/bfdb-wire-layout.test.ts
          git commit -m "style: apply repository Prettier to field alias fix"
          git push origin HEAD:fix/http-mqtt-live-field-alias-2026-11-06
