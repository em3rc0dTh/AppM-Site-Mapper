name: Temporary PR199 Prettier repair
on:
  push:
    branches:
      - feat/automatic-operational-alarm-commissioning
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format only the new Mongo regression test
        run: npx prettier --write tests/integration/automatic-operational-commissioning-mongo.test.ts
      - name: Commit formatting and remove the temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr199-temporary-format.yml
          git add tests/integration/automatic-operational-commissioning-mongo.test.ts
          git commit -m "style: format Mongo legacy-index regression test"
          git push origin HEAD:feat/automatic-operational-alarm-commissioning
