name: Temporary PR200 Prettier repair
on:
  push:
    branches:
      - fix/seed01-internal-equipment-visibility-2026-11-10
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format only changed TS files
        run: |
          npx prettier --write \
            src/app/api/topology/route.ts \
            'src/app/device/[deviceId]/page.tsx' \
            'src/app/topology/[...path]/page.tsx' \
            src/modules/inventory/application/inventory-service.ts \
            src/modules/topology/application/topology-service.ts \
            src/modules/workspace/application/workspace-service.ts
      - name: Commit formatted files and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr200-temporary-format.yml
          git add src/app src/modules
          git commit -m "style: format internal equipment visibility implementation"
          git push origin HEAD:fix/seed01-internal-equipment-visibility-2026-11-10
