name: PR 245 one-shot Prettier

on:
  push:
    branches:
      - feat/field-powerpath-reconciliation-20261119

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'chore: format PowerPath reconciliation'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/field-powerpath-reconciliation-20261119
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format exact CI offenders
        run: |
          npx prettier --write             docs/operations/field-powerpath-reconciliation.md             scripts/operations/reconcile-field-power-paths.mjs             src/components/telemetry/live-mqtt-inspector.module.css             src/components/telemetry/live-mqtt-inspector.tsx             src/modules/telemetry/domain/composition-breaker-telemetry.ts             tests/unit/field-powerpath-reconciliation-contract.test.ts
          git diff --check
      - name: Commit mechanical formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             docs/operations/field-powerpath-reconciliation.md             scripts/operations/reconcile-field-power-paths.mjs             src/components/telemetry/live-mqtt-inspector.module.css             src/components/telemetry/live-mqtt-inspector.tsx             src/modules/telemetry/domain/composition-breaker-telemetry.ts             tests/unit/field-powerpath-reconciliation-contract.test.ts
          git commit -m "chore: format PowerPath reconciliation"
          git push origin HEAD:feat/field-powerpath-reconciliation-20261119
