name: QDF PR214 final formatter (self removing)

on:
  push:
    branches:
      - feat/qdf-breaker-schedule-seed-inspector-20261111

permissions:
  contents: write

jobs:
  format-and-remove:
    if: github.repository == 'em3rc0dTh/AppM-Site-Mapper'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Run canonical Prettier on reconciled inspector
        run: npx prettier --write 'src/app/device/[deviceId]/page.tsx'
      - name: Commit formatted inspector and remove one-time workflow
        run: |
          set -euo pipefail
          git add -- 'src/app/device/[deviceId]/page.tsx'
          git rm -- '.github/workflows/qdf-pr214-format-once.yml'
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'style: normalize merged breaker inspector; remove temporary formatter'
          git push origin HEAD:feat/qdf-breaker-schedule-seed-inspector-20261111
