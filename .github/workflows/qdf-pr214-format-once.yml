name: QDF PR214 one-time scoped formatting

on:
  push:
    branches:
      - feat/qdf-breaker-schedule-seed-inspector-20261111

permissions:
  contents: write

jobs:
  format-scope:
    if: github.repository == 'em3rc0dTh/AppM-Site-Mapper'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format PR files without changing unrelated legacy files
        run: |
          npx prettier --write \
            '.github/workflows/ci.yml' \
            '.github/workflows/clean-full-stack-integration.yml' \
            'scripts/ci/browser-operational-journey.mjs' \
            'src/app/device/[deviceId]/page.tsx' \
            'src/seeds/seed-01.ts' \
            'tests/unit/qdf-breaker-field-schedule.test.ts'
      - name: Commit only formatter changes
        run: |
          set -euo pipefail
          git add -- \
            '.github/workflows/ci.yml' \
            '.github/workflows/clean-full-stack-integration.yml' \
            'scripts/ci/browser-operational-journey.mjs' \
            'src/app/device/[deviceId]/page.tsx' \
            'src/seeds/seed-01.ts' \
            'tests/unit/qdf-breaker-field-schedule.test.ts'
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'style: format PR214 changed files'
            git push origin HEAD:feat/qdf-breaker-schedule-seed-inspector-20261111
          fi
