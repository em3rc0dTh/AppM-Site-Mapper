name: QDF voltage temporary format probe
on:
  push:
    branches:
      - feat/telxius-rfp-qdf-total-voltage
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Show exact Prettier diff
        run: |
          npx prettier --write             src/app/api/telemetry/snmp/feeds/route.ts             src/app/api/telemetry/snmp/hardware-profile/route.ts             src/components/power/snmp-feed-commissioning.tsx             src/modules/telemetry/application/qdf-modbus-projection.ts             src/modules/telemetry/application/qdf-total-voltage.ts             tests/unit/qdf-modbus-projection.test.ts
          git diff --             src/app/api/telemetry/snmp/feeds/route.ts             src/app/api/telemetry/snmp/hardware-profile/route.ts             src/components/power/snmp-feed-commissioning.tsx             src/modules/telemetry/application/qdf-modbus-projection.ts             src/modules/telemetry/application/qdf-total-voltage.ts             tests/unit/qdf-modbus-projection.test.ts
