name: Release branch formatter

on:
  push:
    branches:
      - 'release/**'
    paths:
      - '.github/workflows/release-format.yml'
      - 'docker-compose.integration.yml'
      - 'docs/field/**'
      - 'docs/README.md'
      - 'docs/release/clean-host-installation.md'
      - 'infra/snmp-collector/integration-agent.mjs'
      - 'src/seeds/seed-01.ts'

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply repository Prettier
        run: |
          npx prettier --write             docker-compose.integration.yml             docs/field/commissioning-record.template.md             docs/field/metasys-sat.md             docs/field/real-equipment-commissioning.md             docs/field/site-survey.md             docs/README.md             docs/release/clean-host-installation.md             infra/snmp-collector/integration-agent.mjs             src/seeds/seed-01.ts
      - name: Commit formatter-only changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             docker-compose.integration.yml             docs/field/commissioning-record.template.md             docs/field/metasys-sat.md             docs/field/real-equipment-commissioning.md             docs/field/site-survey.md             docs/README.md             docs/release/clean-host-installation.md             infra/snmp-collector/integration-agent.mjs             src/seeds/seed-01.ts
          git commit -m "style: apply repository prettier"
          git push origin HEAD:${{ github.ref_name }}
