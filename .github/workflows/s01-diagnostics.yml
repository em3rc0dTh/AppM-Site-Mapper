name: S01 Diagnostics (temporary)
on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
  issues: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Collect focused diagnostics
        id: diagnose
        shell: bash
        run: |
          set +e
          echo "### TYPECHECK" > s01-report.txt
          npm run typecheck >> s01-report.txt 2>&1
          echo "### LINT" >> s01-report.txt
          npm run lint >> s01-report.txt 2>&1
          echo "### FORMAT" >> s01-report.txt
          npm run format:check >> s01-report.txt 2>&1
          echo "### UNIT" >> s01-report.txt
          npm run test:unit >> s01-report.txt 2>&1
          tail -n 100 s01-report.txt > s01-report-tail.txt
          cat s01-report-tail.txt
      - name: Publish concise S01 diagnostics to PR 155
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.existsSync('s01-report.txt') ? fs.readFileSync('s01-report.txt','utf8') : 'Install failed before diagnostics.';
            const section = body.split(/(?=### (?:TYPECHECK|LINT|FORMAT|UNIT))/).filter(Boolean);
            const summary = section.map(s => s.slice(0,4500)).join('\n').slice(0,14000);
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: 155,
              body: 'S01 diagnostic run ' + context.runId + '\n\n' + '~~~text\n' + summary + '\n~~~',
            });
