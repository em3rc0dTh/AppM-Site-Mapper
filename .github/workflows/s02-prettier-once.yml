name: S02 acceptance one-time Prettier
on:
  push:
    branches:
      - test/s02-alarm-acceptance-actions
    paths:
      - .github/workflows/s02-prettier-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/s02-alarm-acceptance-actions
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write tests/integration/s02-alarm-acceptance-mongo.test.ts .github/workflows/s02-alarm-acceptance.yml
      - name: Commit and push formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/integration/s02-alarm-acceptance-mongo.test.ts .github/workflows/s02-alarm-acceptance.yml
          if ! git diff --cached --quiet; then
            git commit -m "style(s02): apply repository Prettier to acceptance"
            git push origin HEAD:test/s02-alarm-acceptance-actions
          fi
