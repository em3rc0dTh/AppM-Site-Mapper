name: S03 css formatting
on:
  push:
    branches:
      - feat/mk1-s03-resizable-workspace
    paths:
      - .github/workflows/s03-css-format.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mk1-s03-resizable-workspace
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write 'src/app/s03-workspace.css'
      - name: Commit formatted CSS and remove formatter
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/s03-css-format.yml
          git add 'src/app/s03-workspace.css'
          git add -u .github/workflows/s03-css-format.yml
          git commit -m 'style(workspace): format final S03 CSS'
          git push origin HEAD:feat/mk1-s03-resizable-workspace
