name: S03 final formatting
on:
  push:
    branches:
      - feat/mk1-s03-resizable-workspace
    paths:
      - .github/workflows/s03-final-format.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mk1-s03-resizable-workspace
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format final S03 files
        run: |
          npx prettier --write \
            'src/shared/ui/app-shell.tsx' \
            'src/app/s03-workspace.css' \
            'scripts/ci/browser-operational-journey.mjs'
      - name: Commit formatted files and remove formatter
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/s03-final-format.yml
          git add -- \
            'src/shared/ui/app-shell.tsx' \
            'src/app/s03-workspace.css' \
            'scripts/ci/browser-operational-journey.mjs'
          git add -u .github/workflows/s03-final-format.yml
          if ! git diff --cached --quiet; then
            git commit -m 'style(workspace): format final S03 changes'
            git push origin HEAD:feat/mk1-s03-resizable-workspace
          fi
