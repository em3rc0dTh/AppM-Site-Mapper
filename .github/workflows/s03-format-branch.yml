name: S03 temporary formatting
on:
  push:
    branches:
      - feat/mk1-s03-resizable-workspace
    paths:
      - .github/workflows/s03-format-branch.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mk1-s03-resizable-workspace
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format S03 changed files only
        run: |
          npx prettier --write \
            'src/components/workspace/resizable-workspace.tsx' \
            'src/app/s03-workspace.css' \
            'tests/unit/s03-resizable-workspace.test.ts' \
            'docs/product/sprint-03-resizable-workspace.md' \
            'src/app/topology/[...path]/page.tsx' \
            'src/app/blueprint/[roomId]/page.tsx' \
            'src/app/device/[deviceId]/page.tsx' \
            'src/app/rack/[rackId]/focus/page.tsx' \
            'src/app/layout.tsx'
      - name: Commit formatted files to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            'src/components/workspace/resizable-workspace.tsx' \
            'src/app/s03-workspace.css' \
            'tests/unit/s03-resizable-workspace.test.ts' \
            'docs/product/sprint-03-resizable-workspace.md' \
            'src/app/topology/[...path]/page.tsx' \
            'src/app/blueprint/[roomId]/page.tsx' \
            'src/app/device/[deviceId]/page.tsx' \
            'src/app/rack/[rackId]/focus/page.tsx' \
            'src/app/layout.tsx'
          if ! git diff --cached --quiet; then
            git commit -m 'style(workspace): format S03 implementation'
            git push origin HEAD:feat/mk1-s03-resizable-workspace
          fi
