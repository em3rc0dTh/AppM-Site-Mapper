name: S05 one-time Prettier autofix

on:
  push:
    branches:
      - feat/s05-commissioning-audit
    paths:
      - .github/workflows/s05-prettier-autofix.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/s05-commissioning-audit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply repository Prettier
        run: >
          npx prettier --write
          src/app/api/industrial/commissioning/route.ts
          src/modules/industrial/application/commissioning-observability.ts
          scripts/operations/audit-s05-commissioning.mjs
          tests/unit/industrial-commissioning-idempotency.test.ts
      - name: Commit exact formatter output
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "em3rc0dTh"
          git config user.email "eduardo.farid@thradex.com"
          git add \
            src/app/api/industrial/commissioning/route.ts \
            src/modules/industrial/application/commissioning-observability.ts \
            scripts/operations/audit-s05-commissioning.mjs \
            tests/unit/industrial-commissioning-idempotency.test.ts
          git commit -m "style(s05): apply prettier"
          git push origin HEAD:feat/s05-commissioning-audit
