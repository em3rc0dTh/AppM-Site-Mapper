name: S05 final formatter

on:
  push:
    branches:
      - feat/s05-commissioning-audit
    paths:
      - .github/workflows/s05-prettier-autofix.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/s05-commissioning-audit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply repository Prettier
        run: >
          npx prettier --write
          src/modules/industrial/application/commissioning-observability.ts
          src/modules/telemetry/infrastructure/http-telemetry-store.ts
          tests/unit/commissioning-observability.test.ts
          tests/unit/s05-snmp-history-diagnostics.test.ts
          tests/unit/s05-office-secret-wiring.test.ts
          docker-compose.telemetry.yml
          .github/workflows/s05-commissioning-observability.yml
      - name: Commit exact formatter output
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "em3rc0dTh"
          git config user.email "eduardo.farid@thradex.com"
          git add \
            src/modules/industrial/application/commissioning-observability.ts \
            src/modules/telemetry/infrastructure/http-telemetry-store.ts \
            tests/unit/commissioning-observability.test.ts \
            tests/unit/s05-snmp-history-diagnostics.test.ts \
            tests/unit/s05-office-secret-wiring.test.ts \
            docker-compose.telemetry.yml \
            .github/workflows/s05-commissioning-observability.yml
          git commit -m "style(s05): format final commissioning slice"
          git push origin HEAD:feat/s05-commissioning-audit
