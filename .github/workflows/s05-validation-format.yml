name: S05 validation formatter

on:
  push:
    branches:
      - feat/s05-commissioning-audit
    paths:
      - .github/workflows/s05-validation-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/s05-commissioning-audit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply Prettier
        run: >
          npx prettier --write
          docs/operations/s05-telemetry-recovery.md
          docs/telemetry/s05-commissioning-audit.md
          docs/telemetry/s05-sprint-status.md
          docker-compose.telemetry.yml
          docker-compose.office-test.yml
          tests/unit/s05-office-secret-wiring.test.ts
      - name: Commit formatter output
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "em3rc0dTh"
          git config user.email "eduardo.farid@thradex.com"
          git add \
            docs/operations/s05-telemetry-recovery.md \
            docs/telemetry/s05-commissioning-audit.md \
            docs/telemetry/s05-sprint-status.md \
            docker-compose.telemetry.yml \
            docker-compose.office-test.yml \
            tests/unit/s05-office-secret-wiring.test.ts
          git commit -m "style(s05): format validation fixes"
          git push origin HEAD:feat/s05-commissioning-audit
