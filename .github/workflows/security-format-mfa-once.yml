name: One-shot MFA acceptance test formatting

on:
  push:
    branches:
      - security/site-mapper-3000-owasp-hardening
    paths:
      - .github/workflows/security-format-mfa-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: security/site-mapper-3000-owasp-hardening
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format only TOTP acceptance regression
        run: |
          npx prettier --write tests/integration/mfa-enrollment.test.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/integration/mfa-enrollment.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(test): Prettier normalize final MFA regression"
            git push origin HEAD:security/site-mapper-3000-owasp-hardening
          fi
