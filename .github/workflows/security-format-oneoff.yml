name: Security PR one-time Prettier normalization

on:
  push:
    branches:
      - security/site-mapper-3000-owasp-hardening
    paths:
      - .github/workflows/security-format-oneoff.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout security branch
        uses: actions/checkout@v7
        with:
          ref: security/site-mapper-3000-owasp-hardening
          persist-credentials: true
      - name: Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install locked formatter
        run: npm ci --no-audit --no-fund
      - name: Format only security-branch touched source
        run: |
          npx prettier --write \
            src/app/api/auth/login/route.ts \
            src/app/api/auth/mfa/route.ts \
            src/app/api/industrial/credentials/route.ts \
            src/app/login/page.tsx \
            src/app/settings/page.tsx \
            src/components/settings/mfa-panel.tsx \
            src/components/industrial/commissioning-console.tsx \
            src/modules/identity/application/auth-service.ts \
            src/modules/identity/application/mfa-totp.ts \
            src/modules/identity/application/mfa-service.ts \
            src/modules/identity/application/password-policy.ts \
            src/modules/identity/domain/entities.ts \
            src/modules/identity/infrastructure/mongo-identity-repository.ts \
            src/modules/identity/infrastructure/memory-identity-repository.ts \
            src/shared/http/request-security.ts \
            tests/integration/mfa-enrollment.test.ts \
            tests/unit/password.test.ts \
            tests/unit/request-security.test.ts \
            docs/security/owasp-hardening-http-3000.md \
            docs/security/password-policy-3000.md \
            docs/security/mfa-totp-3000.md \
            docs/security/owasp-implementation-registry-3000.md \
            scripts/ci/http-operational-journey.mjs \
            scripts/ci/mk1-adversarial-http.mjs \
            scripts/ci/deletion-http-journey.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "style(security): normalize OWASP implementation with locked Prettier"
            git push origin HEAD:security/site-mapper-3000-owasp-hardening
          fi
