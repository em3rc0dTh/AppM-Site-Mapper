name: OWASP Site Mapper 3000 Security Acceptance

on:
  push:
    branches:
      - security/site-mapper-3000-owasp-hardening
  pull_request:
    paths:
      - '.github/workflows/security-owasp-3000.yml'
      - 'src/modules/identity/**'
      - 'src/shared/http/**'
      - 'src/app/api/auth/**'
      - 'src/app/api/industrial/credentials/**'
      - 'src/components/settings/mfa-panel.tsx'
      - 'src/components/industrial/commissioning-console.tsx'
      - 'tests/integration/auth-service.test.ts'
      - 'tests/integration/mfa-enrollment.test.ts'
      - 'tests/unit/password.test.ts'
      - 'tests/unit/request-security.test.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-3000:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Authentication, MFA, password and HTTP security acceptance
        run: |
          npx vitest run \
            tests/integration/auth-service.test.ts \
            tests/integration/mfa-enrollment.test.ts \
            tests/unit/password.test.ts \
            tests/unit/request-security.test.ts \
            tests/unit/content-security-policy.test.ts \
            tests/unit/industrial-credential-security.test.ts
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Build
        run: npm run build
