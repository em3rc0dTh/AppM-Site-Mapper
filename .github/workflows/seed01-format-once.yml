name: Temporary seed-01 code formatting

on:
  push:
    branches:
      - fix/seed01-v6-physical-topology-reconciliation
    paths:
      - '.github/workflows/seed01-format-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
          ref: fix/seed01-v6-physical-topology-reconciliation
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format only seed-01 touched sources
        run: |
          npx prettier --write src/seeds/seed-01.ts scripts/seed-01-parity.mjs scripts/seed-01-restore-lab.mjs
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/seeds/seed-01.ts scripts/seed-01-parity.mjs scripts/seed-01-restore-lab.mjs
            git commit -m "style(seed-01): apply repository Prettier formatting"
            git push origin HEAD:fix/seed01-v6-physical-topology-reconciliation
          fi
