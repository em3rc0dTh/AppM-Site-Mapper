name: Temporary SNMP branch formatter
on:
  push:
    branches:
      - feature/snmp-v2c-v3-config2-config4
    paths:
      - .github/workflows/snmp-branch-format.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/snmp-v2c-v3-config2-config4
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format changed files in current branch
        run: |
          npx prettier --write \
            docs/operations/bfdb-snmp-compose-lab.md \
            infra/snmp-collector/server.mjs \
            src/app/api/telemetry/snmp/commission/route.ts \
            src/app/api/telemetry/snmp/hardware-profile/route.ts \
            src/components/power/snmp-feed-commissioning.tsx \
            src/modules/power/domain/bdfb-hardware-profile.ts \
            src/modules/topology/application/access-port-service.ts \
            tests/unit/bdfb-config2.test.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/operations/bfdb-snmp-compose-lab.md infra/snmp-collector/server.mjs src/app/api/telemetry/snmp/commission/route.ts src/app/api/telemetry/snmp/hardware-profile/route.ts src/components/power/snmp-feed-commissioning.tsx src/modules/power/domain/bdfb-hardware-profile.ts src/modules/topology/application/access-port-service.ts tests/unit/bdfb-config2.test.ts
          if ! git diff --cached --quiet; then
            git commit -m 'style(snmp): apply repository Prettier rules'
            git push origin HEAD:feature/snmp-v2c-v3-config2-config4
          fi
