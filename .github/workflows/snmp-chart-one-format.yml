name: Temporary SNMP chart file format
on:
  push:
    branches:
      - feat/snmp-timescale-history-charts-20261022
    paths:
      - .github/workflows/snmp-chart-one-format.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/snmp-timescale-history-charts-20261022
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: |
          npx prettier --write src/components/power/snmp-feed-history.tsx src/app/api/telemetry/snmp/feeds/trends/route.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/components/power/snmp-feed-history.tsx src/app/api/telemetry/snmp/feeds/trends/route.ts
          if ! git diff --cached --quiet; then
            git commit -m 'style(snmp): format final chart sources'
            git push origin HEAD:feat/snmp-timescale-history-charts-20261022
          fi
