name: Temporary synthetic SNMP lab formatter
on:
  push:
    branches:
      - feat/snmp-synthetic-lab-live-config2-20261022
    paths:
      - .github/workflows/snmp-lab-format.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/snmp-synthetic-lab-live-config2-20261022
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format synthetic SNMP lab files
        run: |
          npx prettier --write \
            src/app/api/dev/snmp-lab/commission/route.ts \
            src/modules/telemetry/application/snmp-feed-service.ts \
            src/components/power/snmp-feed-load-panel.tsx \
            tests/unit/bdfb-config2.test.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/app/api/dev/snmp-lab/commission/route.ts src/modules/telemetry/application/snmp-feed-service.ts src/components/power/snmp-feed-load-panel.tsx tests/unit/bdfb-config2.test.ts
          if ! git diff --cached --quiet; then
            git commit -m 'style(snmp): format synthetic lab integration'
            git push origin HEAD:feat/snmp-synthetic-lab-live-config2-20261022
          fi
