name: One-time SNMP Prettier normalization
on:
  push:
    branches:
      - feat/snmp-controller-declarative-live-2026-11-23
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format only the SNMP changed files
        run: |
          npx prettier --write \
            docs/architecture/snmp-controller-declarative-binding-v1.md \
            src/app/api/telemetry/snmp/controller-profile/route.ts \
            src/components/power/snmp-controller-editor.tsx \
            src/components/power/snmp-controller-live.tsx \
            tests/unit/snmp-controller-profile.test.ts
      - name: Commit formatted files and remove this temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/snmp-one-time-prettier.yml
          git add -A -- \
            docs/architecture/snmp-controller-declarative-binding-v1.md \
            src/app/api/telemetry/snmp/controller-profile/route.ts \
            src/components/power/snmp-controller-editor.tsx \
            src/components/power/snmp-controller-live.tsx \
            tests/unit/snmp-controller-profile.test.ts \
            .github/workflows/snmp-one-time-prettier.yml
          if ! git diff --cached --quiet; then
            git commit -m "style(snmp): normalize declarative controller sources"
            git push origin HEAD:feat/snmp-controller-declarative-live-2026-11-23
          fi
