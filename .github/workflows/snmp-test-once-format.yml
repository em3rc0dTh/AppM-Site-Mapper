name: One-time SNMP test formatting
on:
  push:
    branches:
      - fix/snmp-traps-existing-bindings-2026-11-23
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write tests/unit/snmp-config2-seed01-runtime.test.ts
      - name: Commit and remove temporary formatter
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/snmp-test-once-format.yml
          git add -A -- tests/unit/snmp-config2-seed01-runtime.test.ts .github/workflows/snmp-test-once-format.yml
          if ! git diff --cached --quiet; then
            git commit -m "style(test): normalize SNMP source contract test"
            git push origin HEAD:fix/snmp-traps-existing-bindings-2026-11-23
          fi
