name: One-time SNMP Traps source formatting
on:
  push:
    branches:
      - fix/snmp-traps-existing-bindings-2026-11-23
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format exactly the changed files
        run: |
          npx prettier --write \
            src/app/api/telemetry/industrial/traps/route.ts \
            src/components/power/snmp-trap-panel.tsx \
            src/seeds/seed-01.ts
      - name: Remove one-time workflow and commit format
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/snmp-traps-once-format.yml
          git add -A -- \
            src/app/api/telemetry/industrial/traps/route.ts \
            src/components/power/snmp-trap-panel.tsx \
            src/seeds/seed-01.ts \
            .github/workflows/snmp-traps-once-format.yml
          if ! git diff --cached --quiet; then
            git commit -m "style(snmp): format existing source reconciliation"
            git push origin HEAD:fix/snmp-traps-existing-bindings-2026-11-23
          fi
