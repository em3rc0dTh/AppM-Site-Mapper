name: Temporary SNMP Timescale trends formatter
on:
  push:
    branches:
      - feat/snmp-timescale-history-charts-20261022
    paths:
      - .github/workflows/snmp-trends-format.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/snmp-timescale-history-charts-20261022
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format TypeScript and CSS
        run: |
          npx prettier --write \
            src/modules/telemetry/infrastructure/http-telemetry-store.ts \
            src/app/api/telemetry/snmp/feeds/trends/route.ts \
            src/components/power/snmp-feed-history.tsx \
            src/components/power/snmp-feed-load-panel.tsx \
            src/app/interaction-recovery.css
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/modules/telemetry/infrastructure/http-telemetry-store.ts src/app/api/telemetry/snmp/feeds/trends/route.ts src/components/power/snmp-feed-history.tsx src/components/power/snmp-feed-load-panel.tsx src/app/interaction-recovery.css
          if ! git diff --cached --quiet; then
            git commit -m 'style(snmp): apply repository Prettier formatting'
            git push origin HEAD:feat/snmp-timescale-history-charts-20261022
          fi
