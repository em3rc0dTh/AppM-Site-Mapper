name: One-time SNMP visual format
on:
  push:
    branches:
      - feat/snmp-controller-declarative-live-2026-11-23
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format visual component
        run: npx prettier --write src/components/power/snmp-controller-live.tsx
      - name: Commit and remove temporary action
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/snmp-visual-one-time-format.yml
          git add -A -- src/components/power/snmp-controller-live.tsx .github/workflows/snmp-visual-one-time-format.yml
          if ! git diff --cached --quiet; then
            git commit -m "style(snmp): format controller instrument component"
            git push origin HEAD:feat/snmp-controller-declarative-live-2026-11-23
          fi
