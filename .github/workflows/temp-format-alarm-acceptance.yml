name: Temporary Alarm Acceptance formatter
on:
  push:
    branches:
      - feat/alarm-rule-manager-dc48v-mk1
    paths:
      - '.github/workflows/temp-format-alarm-acceptance.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/alarm-rule-manager-dc48v-mk1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format exactly the three new acceptance files
        run: |
          ./node_modules/.bin/prettier --write \
            scripts/ci/alarm-rule-manager-browser.cjs \
            scripts/ci/alarm-rule-manager-http-smoke.mjs \
            tests/integration/alarm-rule-manager-mongo.test.ts
          git add -- \
            scripts/ci/alarm-rule-manager-browser.cjs \
            scripts/ci/alarm-rule-manager-http-smoke.mjs \
            tests/integration/alarm-rule-manager-mongo.test.ts
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'style(ci): Prettier acceptance scripts and Mongo regression test'
            git push origin HEAD:feat/alarm-rule-manager-dc48v-mk1
          fi
