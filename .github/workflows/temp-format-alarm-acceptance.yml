name: Temporary Alarm Acceptance documentation formatter
on:
  push:
    branches:
      - feat/alarm-rule-manager-dc48v-mk1
    paths:
      - '.github/workflows/temp-format-alarm-acceptance.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/alarm-rule-manager-dc48v-mk1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format acceptance test plan only
        run: |
          ./node_modules/.bin/prettier --write \
            docs/operations/alarm-rule-manager-actions-acceptance.md
          git add -- docs/operations/alarm-rule-manager-actions-acceptance.md
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'style(docs): format Rule Manager Actions acceptance plan'
            git push origin HEAD:feat/alarm-rule-manager-dc48v-mk1
          fi
