name: Temp format declared power trace

on:
  push:
    branches:
      - fix/power-trace-declared-target-centric-20261119

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format declared Power Trace files
        run: |
          npx prettier --write src/app/workbench/power-trace.css src/components/workbench/declared-power-trace-workbench.tsx
          echo 'CSS_B64_BEGIN'
          base64 -w0 src/app/workbench/power-trace.css
          echo
          echo 'CSS_B64_END'
          echo 'VIEW_B64_BEGIN'
          base64 -w0 src/components/workbench/declared-power-trace-workbench.tsx
          echo
          echo 'VIEW_B64_END'
