name: Temp format MQTT PUBACK fix

on:
  push:
    branches:
      - fix/mqtt-puback-after-durable-capture-20261119

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format target files
        run: |
          npx prettier --write src/modules/telemetry/infrastructure/telemetry-runtime.ts tests/unit/mqtt-puback-boundary.test.ts
          echo 'RUNTIME_B64_BEGIN'
          base64 -w0 src/modules/telemetry/infrastructure/telemetry-runtime.ts
          echo
          echo 'RUNTIME_B64_END'
          echo 'TEST_B64_BEGIN'
          base64 -w0 tests/unit/mqtt-puback-boundary.test.ts
          echo
          echo 'TEST_B64_END'
