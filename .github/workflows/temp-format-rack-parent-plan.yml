name: Temp format rack parent plan

on:
  push:
    branches:
      - feat/power-rack-parent-authorization-plan-20261119

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format planner files
        run: |
          npx prettier --write scripts/operations/plan-field-power-rack-parent-authorization.mjs tests/unit/field-power-rack-parent-authorization-plan.test.ts
          echo 'SCRIPT_B64_BEGIN'
          base64 -w0 scripts/operations/plan-field-power-rack-parent-authorization.mjs
          echo
          echo 'SCRIPT_B64_END'
          echo 'TEST_B64_BEGIN'
          base64 -w0 tests/unit/field-power-rack-parent-authorization-plan.test.ts
          echo
          echo 'TEST_B64_END'
