name: Temporary PR formatter output
on:
  push:
    branches: [fix/snmp-atomic-batch-security-20261021]
permissions:
  contents: read
jobs:
  format-output:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format requested files and show output for review
        run: |
          npx prettier --write src/modules/telemetry/application/snmp-feed-service.ts src/modules/telemetry/infrastructure/http-telemetry-store.ts
          for path in src/modules/telemetry/application/snmp-feed-service.ts src/modules/telemetry/infrastructure/http-telemetry-store.ts; do
            echo "FORMAT_BEGIN:$path"
            base64 -w0 "$path"
            echo
            echo "FORMAT_END:$path"
          done
