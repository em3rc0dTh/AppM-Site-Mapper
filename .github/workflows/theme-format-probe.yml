name: Theme formatting probe temporary
on:
  push:
    branches: [chore/english-ui-baseline-20261022]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Read-only formatted file outputs
        shell: bash
        run: |
          for f in src/app/operational-light-theme.css scripts/ci/browser-operational-journey.mjs; do
            echo "THEME_FMT_START:$f"
            ./node_modules/.bin/prettier "$f" | base64 -w0
            echo
            echo "THEME_FMT_END:$f"
          done
