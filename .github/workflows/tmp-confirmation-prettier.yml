name: Temporary Confirmation Prettier

on:
  push:
    branches:
      - feat/power-connect-confirmation-stay-20261127

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/power-connect-confirmation-stay-20261127
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write src/components/power/connect-equipment-power-form.tsx
      - name: Commit exact Prettier output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/power/connect-equipment-power-form.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: format commissioning confirmation UX"
          git push origin HEAD:feat/power-connect-confirmation-stay-20261127
