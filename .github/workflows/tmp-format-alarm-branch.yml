name: Temporary alarm branch formatter

on:
  push:
    branches:
      - feat/alarm-operational-ui-2026-10-30

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/alarm-operational-ui-2026-10-30
      - uses: actions/setup-node@v5
        with:
          node-version: 22.20.0
          cache: npm
      - run: npm ci
      - name: Apply repository Prettier
        run: npm run format
      - name: Commit formatting only
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style: apply repository prettier"
          git push origin HEAD:feat/alarm-operational-ui-2026-10-30
