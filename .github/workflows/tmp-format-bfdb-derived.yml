name: TEMP format BFDB derived branch

on:
  push:
    branches:
      - feat/bfdb-derived-power-energy

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/bfdb-derived-power-energy
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format changed TypeScript
        run: |
          npx prettier --write             src/modules/telemetry/application/bfdb-derived-electrical.ts             src/modules/telemetry/infrastructure/telemetry-runtime.ts             tests/unit/bfdb-derived-electrical.test.ts
      - name: Commit exact repository formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             src/modules/telemetry/application/bfdb-derived-electrical.ts             src/modules/telemetry/infrastructure/telemetry-runtime.ts             tests/unit/bfdb-derived-electrical.test.ts
          git commit -m "style: format BFDB derived electrical changes"
          git push origin HEAD:feat/bfdb-derived-power-energy
