name: Temporary branch formatter

on:
  push:
    branches:
      - feat/qdf-operational-projection-2026-11-12

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: feat/qdf-operational-projection-2026-11-12

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply repository Prettier
        run: |
          npx prettier --write \
            docs/operations/qdf5-telemetry-loss-field-acceptance-2026-11-12.md \
            src/components/equipment/snmp-capacity-strip.tsx \
            src/components/power/snmp-feed-history.tsx \
            src/components/power/snmp-feed-load-panel.tsx \
            src/modules/telemetry/application/qdf-operational-contract.ts \
            src/modules/telemetry/application/qdf-operational-projection.ts \
            tests/unit/qdf-operational-projection.test.ts

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/operations/qdf5-telemetry-loss-field-acceptance-2026-11-12.md \
            src/components/equipment/snmp-capacity-strip.tsx \
            src/components/power/snmp-feed-history.tsx \
            src/components/power/snmp-feed-load-panel.tsx \
            src/modules/telemetry/application/qdf-operational-contract.ts \
            src/modules/telemetry/application/qdf-operational-projection.ts \
            tests/unit/qdf-operational-projection.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: apply repository prettier"
            git push origin HEAD:feat/qdf-operational-projection-2026-11-12
          fi
