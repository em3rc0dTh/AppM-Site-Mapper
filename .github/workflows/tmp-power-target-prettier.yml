name: Temporary Power Target Prettier

on:
  push:
    branches:
      - feat/power-target-catalog-uat-20261126

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/power-target-catalog-uat-20261126
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format changed power target files
        run: |
          npx prettier --write \
            src/app/api/power-targets/route.ts \
            src/app/telxius-ui.css \
            src/components/power/connect-equipment-power-form.tsx \
            src/modules/power/application/power-target-catalog-service.ts \
            src/modules/power/domain/power-target-catalog.ts \
            src/modules/power/infrastructure/mongo-power-target-catalog-repository.ts \
            src/shared/infrastructure/mongodb/bootstrap.ts
      - name: Commit exact Prettier output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/app/api/power-targets/route.ts \
            src/app/telxius-ui.css \
            src/components/power/connect-equipment-power-form.tsx \
            src/modules/power/application/power-target-catalog-service.ts \
            src/modules/power/domain/power-target-catalog.ts \
            src/modules/power/infrastructure/mongo-power-target-catalog-repository.ts \
            src/shared/infrastructure/mongodb/bootstrap.ts
          if git diff --cached --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git commit -m "chore: apply prettier to power target catalog"
          git push origin HEAD:feat/power-target-catalog-uat-20261126
