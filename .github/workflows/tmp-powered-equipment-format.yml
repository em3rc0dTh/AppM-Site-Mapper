name: TEMP powered-equipment prettier preview

on:
  pull_request:
    paths:
      - 'src/components/workbench/powered-equipment-connection-diagram.tsx'
      - 'src/modules/power/application/powered-equipment-projection-service.ts'
      - 'tests/unit/powered-equipment-projection.test.ts'
      - '.github/workflows/tmp-powered-equipment-format.yml'

permissions:
  contents: read

jobs:
  preview:
    if: github.head_ref == 'feat/powered-equipment-connections-20261119'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format target files and print exact patch
        run: |
          npx prettier --write             src/components/workbench/powered-equipment-connection-diagram.tsx             src/modules/power/application/powered-equipment-projection-service.ts             tests/unit/powered-equipment-projection.test.ts
          git diff --no-color --             src/components/workbench/powered-equipment-connection-diagram.tsx             src/modules/power/application/powered-equipment-projection-service.ts             tests/unit/powered-equipment-projection.test.ts
