name: Temporary Prettier baseline fix

on:
  push:
    branches:
      - chore/prettier-baseline-cleanup-20261117

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/prettier-baseline-cleanup-20261117
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Format only inherited baseline files
        run: |
          npx prettier --write \
            docs/operations/field-qdf-binding-reconciliation.md \
            scripts/operations/reconcile-field-mqtt-bindings.mjs \
            src/modules/telemetry/application/telemetry-service.ts \
            src/modules/telemetry/domain/bfdb-bound-point.ts \
            src/modules/telemetry/domain/bfdb.ts \
            tests/unit/bfdb-field-binding-guard.test.ts \
            tests/unit/bfdb-telemetry.test.ts

      - name: Verify no other files changed
        run: |
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(docs/operations/field-qdf-binding-reconciliation\.md|scripts/operations/reconcile-field-mqtt-bindings\.mjs|src/modules/telemetry/application/telemetry-service\.ts|src/modules/telemetry/domain/bfdb-bound-point\.ts|src/modules/telemetry/domain/bfdb\.ts|tests/unit/bfdb-field-binding-guard\.test\.ts|tests/unit/bfdb-telemetry\.test\.ts)$' || true)"
          test -z "$unexpected"

      - name: Commit exact Prettier output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/operations/field-qdf-binding-reconciliation.md \
            scripts/operations/reconcile-field-mqtt-bindings.mjs \
            src/modules/telemetry/application/telemetry-service.ts \
            src/modules/telemetry/domain/bfdb-bound-point.ts \
            src/modules/telemetry/domain/bfdb.ts \
            tests/unit/bfdb-field-binding-guard.test.ts \
            tests/unit/bfdb-telemetry.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "style: format inherited telemetry baseline"
          git push origin HEAD:chore/prettier-baseline-cleanup-20261117
