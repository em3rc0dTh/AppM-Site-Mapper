name: Temporary TFARM04 Reconciliation Prettier

on:
  push:
    branches:
      - feat/reconcile-tfarm04-live-delta-20261126

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/reconcile-tfarm04-live-delta-20261126
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write src/components/power/snmp-trap-panel.tsx
      - name: Commit exact Prettier output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/power/snmp-trap-panel.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: format reconciled SNMP trap panel"
          git push origin HEAD:feat/reconcile-tfarm04-live-delta-20261126
