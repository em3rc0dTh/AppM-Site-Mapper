name: Temporary TFARM04 Reconciliation Prettier

on:
  push:
    branches:
      - feat/reconcile-tfarm04-live-delta-20261126

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/reconcile-tfarm04-live-delta-20261126
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format recovered TFARM04 source
        run: |
          npx prettier --write \
            src/app/api/telemetry/industrial/series/route.ts \
            src/app/api/telemetry/industrial/signals/route.ts \
            src/app/site-mapper-brand.css \
            src/components/power/bdfb-telemetry-inspector.tsx \
            src/components/power/snmp-controller-history.tsx \
            src/components/power/snmp-feed-load-panel.tsx \
            src/components/power/snmp-mib-catalog.tsx \
            src/components/power/snmp-trap-panel.module.css \
            src/components/power/snmp-trap-panel.tsx \
            src/modules/telemetry/application/controller-signals-client.ts \
            src/modules/telemetry/domain/industrial/eltek.ts \
            src/modules/telemetry/domain/industrial/observations.ts \
            src/modules/telemetry/domain/industrial/trap-view.ts \
            src/shared/ui/site-mapper-product-header.tsx
      - name: Commit exact Prettier output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/app/api/telemetry/industrial/series/route.ts \
            src/app/api/telemetry/industrial/signals/route.ts \
            src/app/site-mapper-brand.css \
            src/components/power/bdfb-telemetry-inspector.tsx \
            src/components/power/snmp-controller-history.tsx \
            src/components/power/snmp-feed-load-panel.tsx \
            src/components/power/snmp-mib-catalog.tsx \
            src/components/power/snmp-trap-panel.module.css \
            src/components/power/snmp-trap-panel.tsx \
            src/modules/telemetry/application/controller-signals-client.ts \
            src/modules/telemetry/domain/industrial/eltek.ts \
            src/modules/telemetry/domain/industrial/observations.ts \
            src/modules/telemetry/domain/industrial/trap-view.ts \
            src/shared/ui/site-mapper-product-header.tsx
          if git diff --cached --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git commit -m "chore: format recovered TFARM04 runtime delta"
          git push origin HEAD:feat/reconcile-tfarm04-live-delta-20261126
