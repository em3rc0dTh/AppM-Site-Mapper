name: TEMP v14 prettier preview

on:
  push:
    branches:
      - 'feat/powered-equipment-connections-20261119'

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format exact v14 files and print patch
        run: |
          npx prettier --write             docs/operations/qdf-power-target-aid-rack-map.md             src/modules/power/domain/powered-equipment.ts             src/seeds/seed-01.ts
          git diff --no-color --             docs/operations/qdf-power-target-aid-rack-map.md             src/modules/power/domain/powered-equipment.ts             src/seeds/seed-01.ts
