name: Temporary UI Prettier Fix

on:
  push:
    branches:
      - feat/s01-breaker-context-popover
    paths:
      - 'src/components/power/bdfb-chassis.tsx'
      - 'src/components/power/breaker-limit-editor.tsx'
      - '.github/workflows/ui-prettier-fix.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/s01-breaker-context-popover

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply repository Prettier
        run: npx prettier --write src/components/power/bdfb-chassis.tsx src/components/power/breaker-limit-editor.tsx

      - name: Commit formatted UI files
        run: |
          if git diff --quiet -- src/components/power/bdfb-chassis.tsx src/components/power/breaker-limit-editor.tsx; then
            echo "No formatting changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/power/bdfb-chassis.tsx src/components/power/breaker-limit-editor.tsx
          git commit -m "style(ui): apply repository Prettier"
          git push origin HEAD:feat/s01-breaker-context-popover
