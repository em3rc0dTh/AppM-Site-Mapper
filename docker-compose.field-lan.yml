# S06 FIELD LAN additive overlay for Ubuntu/Linux Docker Engine.
# Requires docker-compose.telemetry.yml; do NOT merge with integration overlay.
# Explicitly start only caddy after the existing stack is healthy.
# network_mode: host is intentional: upstream Next.js is loopback-bound on the host.
services:
  caddy:
    image: caddy:2.10.2-alpine
    network_mode: host
    profiles: ["field-lan"]
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./infra/field/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - site_mapper_caddy_data:/data
      - site_mapper_caddy_config:/config
    healthcheck:
      # An HTTP response from the protected app, including a login redirect,
      # is acceptable; TLS trust is checked separately from authorized clients.
      test: ["CMD", "caddy", "version"]
      interval: 60s
      timeout: 10s
      retries: 3

volumes:
  site_mapper_caddy_data:
  site_mapper_caddy_config:
