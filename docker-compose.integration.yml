# Full controlled integration stack.
# Usage:
# docker compose -f docker-compose.telemetry.yml -f docker-compose.integration.yml up -d --build
#
# This profile is self-contained and deliberately synthetic. FIELD deployments do not
# use the controlled publisher/agents; they point the same Site Mapper consumers to
# approved real MQTT/SNMP endpoints.

x-snmp-points: &snmp-points >-
  [{"oid":"1.3.6.1.4.1.8072.9999.2026.49.1.1.0","metric":"CURRENT","unit":"A","scale":0.1},
   {"oid":"1.3.6.1.4.1.8072.9999.2026.49.1.2.0","metric":"CURRENT","unit":"A","scale":0.1},
   {"oid":"1.3.6.1.4.1.8072.9999.2026.49.1.3.0","metric":"CURRENT","unit":"A","scale":0.1},
   {"oid":"1.3.6.1.4.1.8072.9999.2026.49.1.4.0","metric":"CURRENT","unit":"A","scale":0.1},
   {"oid":"1.3.6.1.4.1.8072.9999.2026.49.2.1.0","metric":"VOLTAGE","unit":"V","scale":0.1},
   {"oid":"1.3.6.1.4.1.8072.9999.2026.49.2.2.0","metric":"VOLTAGE","unit":"V","scale":0.1},
   {"oid":"1.3.6.1.4.1.8072.9999.2026.49.2.3.0","metric":"VOLTAGE","unit":"V","scale":0.1},
   {"oid":"1.3.6.1.4.1.8072.9999.2026.49.2.4.0","metric":"VOLTAGE","unit":"V","scale":0.1}]

x-snmp-agent: &snmp-agent
  build:
    context: .
    dockerfile: infra/snmp-collector/Dockerfile
  command: ['node', 'integration-agent.mjs']
  environment:
    SNMP_AGENT_PORT: '1161'
    SNMP_COMMUNITY: site-mapper-integration
  restart: unless-stopped

x-snmp-collector: &snmp-collector
  build:
    context: .
    dockerfile: infra/snmp-collector/Dockerfile
  environment:
    APP_ENV: development
    SNMP_CONTROLLER_PORT: '1161'
    SNMP_VERSION: 2c
    SNMP_COMMUNITY: site-mapper-integration
    SNMP_V2C_ACKNOWLEDGE_PLAINTEXT: 'true'
    SNMP_FEED_POINTS_JSON: *snmp-points
    SNMP_POLL_INTERVAL_MS: '5000'
    SNMP_INGEST_TOKEN: seed01-integration-snmp-token-000000000000000000000001
    SNMP_INGEST_URL: http://site-mapper:3000/api/telemetry/snmp/ingest
  restart: unless-stopped

services:
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    command: ['mosquitto', '-c', '/mosquitto-no-auth.conf']
    volumes:
      - ./infra/integration/mosquitto.conf:/mosquitto-no-auth.conf:ro
    ports:
      - '127.0.0.1:1883:1883'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mosquitto_pub -h 127.0.0.1 -p 1883 -t integration/health -m ok >/dev/null 2>&1',
        ]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  site-mapper:
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s
    environment:
      SITE_MAPPER_INTEGRATION_PROFILE: seed-01-controlled
      TELEMETRY_ENABLED: 'true'
      MQTT_CLIENT_ID: site-mapper-seed01-integration
      MQTT_BROKER_URL: mqtt://mosquitto:1883
      MQTT_TOPIC_PREFIX: data/dev/
      MQTT_TOPIC_FILTER: data/dev/#
      TELEMETRY_HISTORY_ENABLED: 'true'
      SNMP_INGEST_TOKEN: seed01-integration-snmp-token-000000000000000000000001
      INDUSTRIAL_TIMESCALE_ENABLED: 'true'
      INDUSTRIAL_INGEST_SOURCES_JSON: >-
        {"INT-TRAP-QDF-2":"seed01-integration-trap-token-000000000000000000000001"}
      INDUSTRIAL_PROFILES_JSON: >-
        [{"sourceIdentity":"INT-TRAP-QDF-2","protocol":"SNMP","version":"seed01-controlled-trap-v1","staleMs":30000,"rules":[]}]
      MODBUS_SOURCE_UNITS_JSON: >-
        {"26092403950003":1,"26092403950004":2,"26092403950002":3}
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      telemetry-store:
        condition: service_started
      mosquitto:
        condition: service_healthy

  integration-bootstrap:
    image: curlimages/curl:8.12.1
    entrypoint: ['/bin/sh', '-ec']
    command:
      - |
        for attempt in $$(seq 1 60); do
          code="$$(curl -sS -o /tmp/bootstrap.json -w '%{http_code}' \
            -X POST http://site-mapper:3000/api/auth/bootstrap \
            -H 'content-type: application/json' \
            -H 'authorization: Bearer seed01-integration-bootstrap-token-0000000000000001' \
            --data '{"email":"integration@site-mapper.local","password":"Seed01-Integration-Only!2026","displayName":"Seed-01 Integration Admin"}' \
            || true)"
          if [ "$$code" = "201" ]; then
            cat /tmp/bootstrap.json
            exit 0
          fi
          if [ "$$code" = "409" ] && grep -q '"error":"BOOTSTRAP_CLOSED"' /tmp/bootstrap.json; then
            cat /tmp/bootstrap.json
            exit 0
          fi
          sleep 2
        done
        cat /tmp/bootstrap.json 2>/dev/null || true
        exit 1
    depends_on:
      site-mapper:
        condition: service_healthy
    restart: 'no'

  snmp-traps:
    build:
      context: .
      dockerfile: infra/snmp-collector/Dockerfile
    command: ['node', 'trap-receiver.mjs']
    environment:
      APP_ENV: development
      SNMP_TRAP_SOURCES_JSON: >-
        [{"sourceIdentity":"INT-TRAP-QDF-2","address":"172.29.240.20","version":"2c","community":"site-mapper-integration-trap","token":"seed01-integration-trap-token-000000000000000000000001"}]
      SNMP_TRAP_BIND_HOST: 0.0.0.0
      SNMP_TRAP_PORT: '1162'
      SNMP_TRAP_MAX_PENDING: '1000'
      SNMP_TRAP_ENGINE_ID: 8000B9838001020305
      SNMP_TRAP_SPOOL: /data/traps
      INDUSTRIAL_INGEST_URL: http://site-mapper:3000/api/telemetry/industrial/ingest
    volumes:
      - integration_trap_spool:/data
    networks:
      default:
      integration_ot:
        ipv4_address: 172.29.240.10
    depends_on:
      site-mapper:
        condition: service_healthy
    restart: unless-stopped

  snmp-trap-sender:
    build:
      context: .
      dockerfile: infra/snmp-collector/Dockerfile
    command: ['node', 'integration-trap-sender.mjs']
    environment:
      SNMP_TRAP_TARGET: snmp-traps
      SNMP_TRAP_PORT: '1162'
      SNMP_TRAP_COMMUNITY: site-mapper-integration-trap
      SNMP_TRAP_INTERVAL_MS: '5000'
    networks:
      integration_ot:
        ipv4_address: 172.29.240.20
    depends_on:
      snmp-traps:
        condition: service_started
    restart: unless-stopped

  mqtt-publisher:
    image: eclipse-mosquitto:2.0.20
    entrypoint: ['/bin/sh', '/integration/mqtt-publisher.sh']
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: '1883'
      MQTT_PUBLISH_INTERVAL_SECONDS: '5'
    volumes:
      - ./infra/integration/mqtt-publisher.sh:/integration/mqtt-publisher.sh:ro
    depends_on:
      mosquitto:
        condition: service_healthy
      site-mapper:
        condition: service_healthy
    restart: unless-stopped

  snmp-agent-qdf2:
    <<: *snmp-agent
    environment:
      SNMP_AGENT_PORT: '1161'
      SNMP_COMMUNITY: site-mapper-integration
      SNMP_AGENT_SOURCE: INT-SNMP-QDF-2

  snmp-agent-qdf4:
    <<: *snmp-agent
    environment:
      SNMP_AGENT_PORT: '1161'
      SNMP_COMMUNITY: site-mapper-integration
      SNMP_AGENT_SOURCE: INT-SNMP-QDF-4

  snmp-agent-qdf5:
    <<: *snmp-agent
    environment:
      SNMP_AGENT_PORT: '1161'
      SNMP_COMMUNITY: site-mapper-integration
      SNMP_AGENT_SOURCE: INT-SNMP-QDF-5

  snmp-collector-qdf2:
    <<: *snmp-collector
    environment:
      APP_ENV: development
      SNMP_CONTROLLER_HOST: snmp-agent-qdf2
      SNMP_CONTROLLER_PORT: '1161'
      SNMP_CONTROLLER_ID: INT-SNMP-QDF-2
      SNMP_VERSION: 2c
      SNMP_COMMUNITY: site-mapper-integration
      SNMP_V2C_ACKNOWLEDGE_PLAINTEXT: 'true'
      SNMP_FEED_POINTS_JSON: *snmp-points
      SNMP_POLL_INTERVAL_MS: '5000'
      SNMP_INGEST_TOKEN: seed01-integration-snmp-token-000000000000000000000001
      SNMP_INGEST_URL: http://site-mapper:3000/api/telemetry/snmp/ingest
    depends_on:
      site-mapper:
        condition: service_healthy
      snmp-agent-qdf2:
        condition: service_started

  snmp-collector-qdf4:
    <<: *snmp-collector
    environment:
      APP_ENV: development
      SNMP_CONTROLLER_HOST: snmp-agent-qdf4
      SNMP_CONTROLLER_PORT: '1161'
      SNMP_CONTROLLER_ID: INT-SNMP-QDF-4
      SNMP_VERSION: 2c
      SNMP_COMMUNITY: site-mapper-integration
      SNMP_V2C_ACKNOWLEDGE_PLAINTEXT: 'true'
      SNMP_FEED_POINTS_JSON: *snmp-points
      SNMP_POLL_INTERVAL_MS: '5000'
      SNMP_INGEST_TOKEN: seed01-integration-snmp-token-000000000000000000000001
      SNMP_INGEST_URL: http://site-mapper:3000/api/telemetry/snmp/ingest
    depends_on:
      site-mapper:
        condition: service_healthy
      snmp-agent-qdf4:
        condition: service_started

  snmp-collector-qdf5:
    <<: *snmp-collector
    environment:
      APP_ENV: development
      SNMP_CONTROLLER_HOST: snmp-agent-qdf5
      SNMP_CONTROLLER_PORT: '1161'
      SNMP_CONTROLLER_ID: INT-SNMP-QDF-5
      SNMP_VERSION: 2c
      SNMP_COMMUNITY: site-mapper-integration
      SNMP_V2C_ACKNOWLEDGE_PLAINTEXT: 'true'
      SNMP_FEED_POINTS_JSON: *snmp-points
      SNMP_POLL_INTERVAL_MS: '5000'
      SNMP_INGEST_TOKEN: seed01-integration-snmp-token-000000000000000000000001
      SNMP_INGEST_URL: http://site-mapper:3000/api/telemetry/snmp/ingest
    depends_on:
      site-mapper:
        condition: service_healthy
      snmp-agent-qdf5:
        condition: service_started

volumes:
  integration_trap_spool:

networks:
  integration_ot:
    ipam:
      config:
        - subnet: 172.29.240.0/24
