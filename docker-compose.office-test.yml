      SNMP_V2C_ACKNOWLEDGE_PLAINTEXT: '${SNMP_REAL_V2C_ACKNOWLEDGE_PLAINTEXT:-true}'
      SNMP_V3_USERNAME: '${SNMP_REAL_V3_USERNAME:-}'
      SNMP_V3_AUTH_KEY: '${SNMP_REAL_V3_AUTH_KEY:-}'
      SNMP_V3_PRIV_KEY: '${SNMP_REAL_V3_PRIV_KEY:-}'
      SNMP_FEED_POINTS_JSON: *office-config2-points
      SNMP_POLL_INTERVAL_MS: '${SNMP_POLL_INTERVAL_MS:-5000}'
      SNMP_INGEST_TOKEN: '${SNMP_INGEST_TOKEN:?Set SNMP_INGEST_TOKEN}'
      SNMP_INGEST_URL: http://site-mapper:3000/api/telemetry/snmp/ingest

  office-snmp-agent-qdf2:
