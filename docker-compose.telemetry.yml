services:
  mongodb:
    image: mongo:7.0
    command: ['mongod', '--bind_ip_all']
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - site_mapper_mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand({ ping: 1 }).ok']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: site_mapper_telemetry
      POSTGRES_USER: site_mapper
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - site_mapper_timescale_data:/var/lib/postgresql/data
      - ./infra/telemetry-store/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U site_mapper -d site_mapper_telemetry']
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  telemetry-store:
    build:
      context: ./infra/telemetry-store
    environment:
      TIMESCALE_DSN: postgresql://site_mapper@timescaledb:5432/site_mapper_telemetry
      STORE_HOST: 0.0.0.0
      STORE_PORT: '8080'
    ports:
      - '127.0.0.1:18081:8080'
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

  modbus-tcp:
    build:
      context: .
      dockerfile: infra/modbus-tcp/Dockerfile
    environment:
      MODBUS_SOURCE_UNITS_JSON: '${MODBUS_SOURCE_UNITS_JSON:?Set the approved serial-to-unit map}'
      MODBUS_BRIDGE_TOKEN: '${MODBUS_BRIDGE_TOKEN:?Set a private Modbus bridge token}'
      MODBUS_BIND_HOST: 0.0.0.0
      MODBUS_BIND_PORT: '1502'
      MODBUS_INGEST_HOST: 0.0.0.0
      MODBUS_INGEST_PORT: '18082'
    ports:
      - '127.0.0.1:1502:1502'
      - '127.0.0.1:18082:18082'
    restart: unless-stopped

  operational-console:
    build:
      context: .
      dockerfile: infra/operational-console/Dockerfile
    environment:
      MONGODB_URI: mongodb://mongodb:27017/
      MONGODB_DB_NAME: '${MONGODB_DB_NAME:-appm_site_mapper}'
      TIMESCALE_DSN: postgresql://site_mapper@timescaledb:5432/site_mapper_telemetry
      SITE_MAPPER_API_URL: '${SITE_MAPPER_API_URL:-http://host.docker.internal:3000}'
      MQTT_BROKER_URL: '${MQTT_BROKER_URL:-}'
      MQTT_USERNAME: '${MQTT_USERNAME:-}'
      MQTT_PASSWORD: '${MQTT_PASSWORD:-}'
      MQTT_TOPIC_FILTER: '${MQTT_TOPIC_FILTER:-data/dev/#}'
      CONSOLE_HOST: 0.0.0.0
      CONSOLE_PORT: '3100'
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - '127.0.0.1:3100:3100'
    depends_on:
      mongodb:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

volumes:
  site_mapper_mongo_data:
  site_mapper_timescale_data:
