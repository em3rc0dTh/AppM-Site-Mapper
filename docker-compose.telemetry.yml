services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: site_mapper_telemetry
      POSTGRES_USER: site_mapper
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - site_mapper_timescale_data:/var/lib/postgresql/data
      - ./infra/telemetry-store/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U site_mapper -d site_mapper_telemetry']
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  telemetry-store:
    build:
      context: ./infra/telemetry-store
    environment:
      TIMESCALE_DSN: postgresql://site_mapper@timescaledb:5432/site_mapper_telemetry
      STORE_HOST: 0.0.0.0
      STORE_PORT: '8080'
    ports:
      - '127.0.0.1:18081:8080'
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

volumes:
  site_mapper_timescale_data:
