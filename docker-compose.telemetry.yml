services:
  mongodb:
    image: mongo:7.0
    command: ['mongod', '--bind_ip_all', '--replSet', 'rs0']
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - site_mapper_mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand({ ping: 1 }).ok']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  mongo-init:
    image: mongo:7.0
    depends_on:
      mongodb:
        condition: service_healthy
    entrypoint: ['/bin/sh', '-ec']
    command:
      - |
        mongosh --quiet --host mongodb:27017 --eval '
          try {
            const status = rs.status();
            if (status.ok !== 1) quit(1);
          } catch (error) {
            if (error.codeName !== "NotYetInitialized" && error.code !== 94) throw error;
            rs.initiate({_id:"rs0",members:[{_id:0,host:"mongodb:27017"}]});
          }
        '
        for attempt in $(seq 1 30); do
          if mongosh --quiet --host mongodb:27017 --eval 'if (!db.hello().isWritablePrimary) quit(1)' >/dev/null 2>&1; then
            exit 0
          fi
          sleep 2
        done
        exit 1
    restart: 'no'

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: site_mapper_telemetry
      POSTGRES_USER: site_mapper
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - site_mapper_timescale_data:/var/lib/postgresql/data
      - ./infra/telemetry-store/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U site_mapper -d site_mapper_telemetry']
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  site-mapper:
    build:
      context: .
      dockerfile: infra/site-mapper/Dockerfile
    environment:
      APP_ENV: development
      APP_PERSISTENCE: mongodb
      MONGODB_URI: mongodb://mongodb:27017/?replicaSet=rs0&directConnection=true
      MONGODB_DB_NAME: '${MONGODB_DB_NAME:-appm_site_mapper}'
      BOOTSTRAP_ADMIN_TOKEN: '${BOOTSTRAP_ADMIN_TOKEN:?Set a private bootstrap admin token}'
      TELEMETRY_ENABLED: '${TELEMETRY_ENABLED:-false}'
      MQTT_BROKER_URL: '${MQTT_BROKER_URL:-}'
      MQTT_USERNAME: '${MQTT_USERNAME:-}'
      MQTT_PASSWORD: '${MQTT_PASSWORD:-}'
      MQTT_TOPIC_FILTER: '${MQTT_TOPIC_FILTER:-data/dev/#}'
      MQTT_TOPIC_PREFIX: '${MQTT_TOPIC_PREFIX:-data/dev/}'
      TELEMETRY_HISTORY_ENABLED: '${TELEMETRY_HISTORY_ENABLED:-true}'
      SNMP_INGEST_TOKEN: '${SNMP_INGEST_TOKEN:-}'
      TELEMETRY_STORE_URL: http://telemetry-store:8080
      TELEMETRY_STORE_AUTOSTART: 'false'
      MODBUS_BRIDGE_URL: http://modbus-tcp:18082
      MODBUS_BRIDGE_TOKEN: '${MODBUS_BRIDGE_TOKEN:?Set a private Modbus bridge token}'
      MODBUS_SOURCE_UNITS_JSON: '${MODBUS_SOURCE_UNITS_JSON:?Set the approved serial-to-unit map}'
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      telemetry-store:
        condition: service_started
    restart: unless-stopped

  telemetry-store:
    build:
      context: ./infra/telemetry-store
    environment:
      TIMESCALE_DSN: postgresql://site_mapper@timescaledb:5432/site_mapper_telemetry
      STORE_HOST: 0.0.0.0
      STORE_PORT: '8080'
    ports:
      - '127.0.0.1:18081:8080'
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

  modbus-tcp:
    build:
      context: .
      dockerfile: infra/modbus-tcp/Dockerfile
    environment:
      MODBUS_SOURCE_UNITS_JSON: '${MODBUS_SOURCE_UNITS_JSON:?Set the approved serial-to-unit map}'
      MODBUS_POINT_LAYOUT: '${MODBUS_POINT_LAYOUT:-panels-4x24}'
      MODBUS_BRIDGE_TOKEN: '${MODBUS_BRIDGE_TOKEN:?Set a private Modbus bridge token}'
      MODBUS_BIND_HOST: 0.0.0.0
      MODBUS_BIND_PORT: '1502'
      MODBUS_INGEST_HOST: 0.0.0.0
      MODBUS_INGEST_PORT: '18082'
    ports:
      - '127.0.0.1:1503:1502'
      - '127.0.0.1:18082:18082'
    restart: unless-stopped

  operational-console:
    build:
      context: .
      dockerfile: infra/operational-console/Dockerfile
    environment:
      MONGODB_URI: mongodb://mongodb:27017/?replicaSet=rs0&directConnection=true
      MONGODB_DB_NAME: '${MONGODB_DB_NAME:-appm_site_mapper}'
      TIMESCALE_DSN: postgresql://site_mapper@timescaledb:5432/site_mapper_telemetry
      SITE_MAPPER_API_URL: http://site-mapper:3000
      MQTT_BROKER_URL: '${MQTT_BROKER_URL:-}'
      MQTT_USERNAME: '${MQTT_USERNAME:-}'
      MQTT_PASSWORD: '${MQTT_PASSWORD:-}'
      MQTT_TOPIC_FILTER: '${MQTT_TOPIC_FILTER:-data/dev/#}'
      CONSOLE_HOST: 0.0.0.0
      CONSOLE_PORT: '3100'
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - '127.0.0.1:3100:3100'
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      site-mapper:
        condition: service_started
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

volumes:
  site_mapper_mongo_data:
  site_mapper_timescale_data:
