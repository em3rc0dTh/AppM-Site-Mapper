services:
  mongo:
    image: mongo:8.0
    ports:
      - '127.0.0.1:27017:27017'
    command: ['mongod', '--bind_ip_all', '--quiet']
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 2s
      timeout: 2s
      retries: 30

  mqtt:
    image: eclipse-mosquitto:2.1.2-alpine
    ports:
      - '127.0.0.1:1883:1883'
    volumes:
      - ./mosquitto.demo.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "mosquitto_sub -h 127.0.0.1 -p 1883 -t '$$SYS/broker/version' -C 1 -W 2 >/dev/null 2>&1",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
