# LOCAL SYNTHETIC DEMO ONLY.
# Deliberately plaintext/anonymous on loopback via docker-compose.telemetry.yml.
# Never reuse this file for production or a remotely exposed broker.

persistence false
log_dest stdout
log_type error
log_type warning
log_type notice

listener 1883 0.0.0.0
protocol mqtt
allow_anonymous true
max_qos 1
max_packet_size 278528
max_inflight_messages 20
max_queued_messages 1000
