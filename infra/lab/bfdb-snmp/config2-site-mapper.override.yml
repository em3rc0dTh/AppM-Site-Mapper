# Local-only bridge between the independent BFDB and Site Mapper Compose projects.
x-config2-points: &config2-points >-
  [{"oid":"1.3.6.1.4.1.8072.9999.2026.48.1.1.0","metric":"CURRENT","scale":0.1},
   {"oid":"1.3.6.1.4.1.8072.9999.2026.48.1.2.0","metric":"CURRENT","scale":0.1},
   {"oid":"1.3.6.1.4.1.8072.9999.2026.48.2.1.0","metric":"VOLTAGE","scale":0.1},
   {"oid":"1.3.6.1.4.1.8072.9999.2026.48.2.2.0","metric":"VOLTAGE","scale":0.1}]
x-collector-environment: &collector-environment
  APP_ENV: development
  SNMP_CONTROLLER_PORT: '1161'
  SNMP_VERSION: ${SNMP_VERSION:-3}
  SNMP_COMMUNITY: ${SNMP_COMMUNITY:-}
  SNMP_V3_USERNAME: ${SNMP_V3_USERNAME:-}
  SNMP_V3_AUTH_KEY: ${SNMP_V3_AUTH_KEY:-}
  SNMP_V3_PRIV_KEY: ${SNMP_V3_PRIV_KEY:-}
  SNMP_FEED_POINTS_JSON: *config2-points
  SNMP_POLL_INTERVAL_MS: '30000'
  SNMP_INGEST_TOKEN: ${SNMP_INGEST_TOKEN:?Configure Site Mapper .env}
  SNMP_INGEST_URL: http://site-mapper:3000/api/telemetry/snmp/ingest
x-collector-common: &collector-common
  profiles: ['snmp']
  build:
    context: .
    dockerfile: infra/snmp-collector/Dockerfile
  depends_on:
    site-mapper:
      condition: service_started
  networks: [default, bfdb_snmp_lab]
  restart: unless-stopped
services:
  site-mapper:
    networks: [default, bfdb_snmp_lab]
    environment:
      TELEMETRY_ENABLED: 'true'
      MQTT_BROKER_URL: mqtt://mosquitto:1883
      MQTT_TOPIC_PREFIX: data/dev/
      MQTT_TOPIC_FILTER: data/dev/#
      TELEMETRY_HISTORY_ENABLED: 'true'
  snmp-collector:
    <<: *collector-common
    environment:
      <<: *collector-environment
      SNMP_CONTROLLER_HOST: snmp-agent-bfdb-01
      SNMP_CONTROLLER_ID: EMU-DELTA-BFDB-01
  snmp-collector-02:
    <<: *collector-common
    environment:
      <<: *collector-environment
      SNMP_CONTROLLER_HOST: snmp-agent-bfdb-02
      SNMP_CONTROLLER_ID: EMU-DELTA-BFDB-02
  snmp-collector-03:
    <<: *collector-common
    environment:
      <<: *collector-environment
      SNMP_CONTROLLER_HOST: snmp-agent-bfdb-03
      SNMP_CONTROLLER_ID: EMU-DELTA-BFDB-03
networks:
  bfdb_snmp_lab:
    external: true
    name: site_mapper_bfdb_snmp_lab
