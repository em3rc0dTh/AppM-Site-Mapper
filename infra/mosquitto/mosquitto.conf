# G16 reference broker policy for the raw hardware ingestion boundary.
# Tested against Eclipse Mosquitto 2.1.2.
#
# Credentials and certificates are runtime-mounted. Never commit them.

persistence true
persistence_location /mosquitto/data/
persistence_file mosquitto.db
autosave_interval 60

# Match the application ingress envelope with explicit broker-side bounds.
max_packet_size 278528
max_inflight_messages 20
max_queued_messages 1000
max_queued_bytes 67108864

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

# No plaintext listener is defined.
listener 8883 0.0.0.0
protocol mqtt
accept_protocol_versions 4, 5
listener_allow_anonymous false
max_qos 1

# Transitional file-based auth for Mosquitto 2.1.x.
# The 2.1 line deprecates these directives in favour of the password/ACL plugins.
# Migration to the plugin or Dynamic Security API is a G16 operational gate before
# any future broker major-version upgrade.
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2
