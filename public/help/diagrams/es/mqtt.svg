>Breaker</text><text x="934" y="253" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#576d81">4 lecturas vinculadas</text><text x="550" y="359" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#46627d">4/4 significa vinculado; revisa LIVE para saber si recibe datos.</text></svg>