<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 410" role="img" aria-label="Las lecturas de entradas y circuitos se consultan por separado">
<title>Las lecturas de entradas y circuitos se consultan por separado</title><rect width="1100" height="410" rx="24" fill="#f5f9fe"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#4686be"/></marker></defs><text x="550" y="47" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#153d61">Las lecturas de entradas y circuitos se consultan por separado</text><rect x="367" y="77" width="366" height="80" rx="12" fill="#e2f2ff" stroke="#a2cde9" stroke-width="2"/><text x="550" y="125" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#142e49">EQUIPO DE DISTRIBUCIÓN</text><path d="M456 160 L290 220" fill="none" stroke="#4686be" stroke-width="3" marker-end="url(#arrow)"/><path d="M644 160 L809 220" fill="none" stroke="#4686be" stroke-width="3" marker-end="url(#arrow)"/><rect x="51" y="232" width="471" height="111" rx="14" fill="#fff" stroke="#d5e5f4" stroke-width="2"/><rect x="576" y="232" width="471" height="111" rx="14" fill="#fff" stroke="#d5e5f4" stroke-width="2"/><text x="286" y="272" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#142e49">ENTRADAS PRINCIPALES</text><text x="813" y="272" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#142e49">CIRCUITOS DEL PANEL</text><text x="286" y="313" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#2470a2">A · B</text><text x="813" y="313" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#2470a2">01 · 02 · 03 ...</text><text x="550" y="387" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#45647f">Las lecturas pueden ser diferentes: provienen de lugares distintos.</text></svg>